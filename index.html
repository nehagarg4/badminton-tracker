<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JCC Badminton Tournament Tracker</title>
<meta name="description" content="Match scores, standings and player analytics for the JCC Badminton Series and future tournaments.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230f9d78'/><circle cx='16' cy='21' r='4.5' fill='white'/><path d='M16 17 L10 5 M16 17 L16 4 M16 17 L22 5' stroke='white' stroke-width='1.6' stroke-linecap='round' fill='none'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#070B16; --surface:rgba(255,255,255,.030); --surface2:rgba(255,255,255,.055); --surface3:rgba(255,255,255,.085);
  --border:rgba(255,255,255,.085); --border2:rgba(255,255,255,.13);
  --text:#EAF0FB; --text2:#9AA4BC; --muted:#6B7794; --faint:#566078;
  --accent:#F5C518; --accent-ink:#0A0E1A; --accent-bg:rgba(245,197,24,.12); --accent-bd:rgba(245,197,24,.30);
  --teamA:#38BDF8; --teamA-bg:rgba(56,189,248,.14);
  --teamB:#FF6B7A; --teamB-bg:rgba(255,107,122,.14);
  --win:#5CE6A1; --win-bg:rgba(92,230,161,.14);
  --gold:#F5C518; --danger:#FF6B7A; --danger-bg:rgba(255,77,94,.14);
  --radius:18px; --radius-sm:12px; --radius-xs:9px;
  --shadow:0 10px 30px rgba(0,0,0,.35); --head-h:66px;
  --disp:'Anton',-apple-system,sans-serif; --head:'Barlow Condensed',-apple-system,sans-serif;
  color-scheme:dark;
}
/* light variant (secondary) */
:root[data-theme="light"]{
  --bg:#EEF1F6; --surface:rgba(16,24,40,.028); --surface2:rgba(16,24,40,.055); --surface3:rgba(16,24,40,.09);
  --border:rgba(16,24,40,.10); --border2:rgba(16,24,40,.16);
  --text:#121725; --text2:#45506B; --muted:#6B7794; --faint:#8a94a6;
  --accent-bg:rgba(224,135,15,.14); --accent-bd:rgba(224,135,15,.35);
  --win:#15924f; --win-bg:rgba(21,146,79,.12); --danger:#d6454f; --danger-bg:rgba(214,69,69,.12);
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.45;
  background:
   radial-gradient(900px 520px at 8% -6%, rgba(245,197,24,.14), transparent 60%),
   radial-gradient(900px 520px at 94% -4%, rgba(139,92,246,.16), transparent 60%),
   radial-gradient(1200px 740px at 50% 122%, rgba(34,167,224,.10), transparent 60%),
   var(--bg);
  background-attachment:fixed;}
:root[data-theme="light"] body{background:
   radial-gradient(900px 520px at 8% -6%, rgba(245,197,24,.18), transparent 60%),
   radial-gradient(900px 520px at 94% -4%, rgba(139,92,246,.12), transparent 60%),
   var(--bg);background-attachment:fixed;}
h1,h2,h3{font-family:var(--head)}
.disp,.num{font-family:var(--disp);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.5px}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--text)}

/* ---------- header ---------- */
.header{position:sticky;top:0;z-index:40;background:rgba(7,11,22,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:12px clamp(16px,4vw,40px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
:root[data-theme="light"] .header{background:rgba(238,241,246,.85)}
.brand{display:flex;align-items:center;gap:13px;margin-right:auto}
.brand .logo{width:46px;height:46px;flex-shrink:0;border-radius:13px;background:linear-gradient(145deg,#F5C518,#E0870F);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(245,197,24,.28)}
.brand .logo svg{width:26px;height:26px}
.brand h1{font-family:var(--head);font-size:21px;font-weight:700;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.brand .sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-top:2px}
.hcontrols{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tsel{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:8px 14px}
.tsel label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:2px}
.tsel select{border:none;background:none;font-weight:600;font-size:14px;padding:2px;max-width:42vw;text-overflow:ellipsis;color:var(--text)}
.tsel select:focus{outline:none}
.tsel select option{background:#0C1324;color:var(--text)}
.iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;color:var(--text2);transition:.12s}
.iconbtn:hover{background:var(--surface3);color:var(--text)}
.iconbtn[disabled]{opacity:.3;pointer-events:none}
.iconbtn.active{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.iconbtn svg{width:18px;height:18px}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);color:var(--text2)}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn.live{color:#9BD9FB;background:rgba(34,167,224,.12);border-color:rgba(34,167,224,.3)}
.conn.live .dot{background:#4FC3F7;box-shadow:0 0 10px #4FC3F7}
.conn.local{color:var(--text2)}
.conn.local .dot{background:var(--gold)}
.conn.user{cursor:pointer;padding-left:8px}
.conn.user:hover{color:var(--text);background:var(--surface3)}
.conn.user.named{color:var(--text)}
.conn.user.named .dot{display:none}
.conn.user.named::before{content:'';width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,#8B5CF6,#5B6BF0);margin-right:-2px}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:calc(var(--head-h));z-index:30;background:rgba(7,11,22,.72);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);display:flex;gap:8px;padding:0 clamp(12px,4vw,40px);overflow-x:auto}
:root[data-theme="light"] .tabs{background:rgba(238,241,246,.8)}
.tab{padding:12px 14px 14px;font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:1px;text-transform:uppercase;
  color:var(--text2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0}
.tab svg{width:16px;height:16px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent-ink);background:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab.active svg{stroke:var(--accent-ink)}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:clamp(18px,3vw,30px) clamp(16px,4vw,40px) 90px}
.page{display:none}.page.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sectionhead{display:flex;align-items:flex-end;gap:14px;margin:4px 0 20px;flex-wrap:wrap}
.sectionhead h2{font-family:var(--disp);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:.92;text-transform:uppercase;letter-spacing:1px}
.sectionhead .spacer{margin-left:auto}
.subtle{color:var(--text2);font-size:13px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .spacer{flex:1 1 auto;min-width:0}
.searchbox{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:15px;margin-bottom:14px;color:var(--text)}
.searchbox:focus{outline:none;border-color:var(--accent-bd);box-shadow:0 0 0 3px var(--accent-bg)}
.searchbox::placeholder{color:var(--muted)}
@media(max-width:600px){ .toolbar .spacer{display:none} }

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);transition:.12s;white-space:nowrap}
.btn:hover{background:var(--surface3)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.primary svg{stroke:var(--accent-ink)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.danger{color:var(--danger);background:rgba(255,77,94,.1);border-color:rgba(255,77,94,.35)}
.btn.danger:hover{background:rgba(255,77,94,.18)}

/* ---------- hero (dashboard) ---------- */
.hero{position:relative;overflow:hidden;margin-bottom:22px;border-radius:22px;border:1px solid var(--border);
  background:linear-gradient(120deg,#0C1324 0%,#111A31 60%,#0C1324 100%);padding:clamp(26px,4vw,42px)}
:root[data-theme="light"] .hero{background:linear-gradient(120deg,#fff,#eef2fb)}
.hero .streak{position:absolute;transform:skewX(-16deg);filter:blur(1px);pointer-events:none}
.hero .s1{top:-40px;right:-60px;width:360px;height:420px;background:linear-gradient(180deg,rgba(139,92,246,.35),transparent)}
.hero .s2{bottom:-60px;right:120px;width:220px;height:380px;background:linear-gradient(180deg,rgba(34,167,224,.28),transparent)}
.hero .s3{top:30px;left:-30px;width:200px;height:300px;background:linear-gradient(180deg,rgba(245,197,24,.22),transparent)}
.hero .inner{position:relative}
.hero .kicker{display:flex;align-items:center;gap:12px;font-family:var(--head);font-weight:600;letter-spacing:5px;font-size:13px;color:#9BD9FB;text-transform:uppercase}
.hero .kicker i{height:3px;width:44px;background:var(--accent);border-radius:2px}
.hero h1{font-family:var(--disp);font-weight:400;line-height:.9;letter-spacing:1px;font-size:clamp(44px,8vw,82px);text-transform:uppercase;margin:12px 0 0;color:#fff}
.hero h1 .ac{color:var(--accent)}
.hero .meta{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:16px;color:var(--text2);font-weight:600;font-size:15px}
.hero .edition{font-family:var(--disp);font-size:20px;letter-spacing:2px;color:#0A0E1A;background:#FF5A3C;padding:6px 15px;border-radius:8px;transform:skewX(-6deg)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.tile.clk{cursor:pointer;transition:.14s}
.tile.clk:hover{border-color:var(--accent-bd);background:var(--surface2);transform:translateY(-2px)}
.tile .k{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:2px;display:flex;align-items:center;gap:8px}
.tile .k svg{width:16px;height:16px;color:var(--accent)}
.tile .v{font-family:var(--disp);font-size:46px;line-height:1;margin-top:10px;color:#fff}
:root[data-theme="light"] .tile .v{color:var(--text)}
.tile .v.disp{font-size:26px;letter-spacing:.5px}
.tile .v small{font-size:20px;color:var(--muted);font-weight:400}
.tile.accent{background:linear-gradient(145deg,rgba(245,197,24,.14),rgba(245,197,24,.03));border-color:var(--accent-bd)}
.tile.accent .v{color:var(--accent)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.card.pad{padding:24px 26px}
.card-title{font-family:var(--head);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card-title svg{width:18px;height:18px;flex-shrink:0;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

/* ---------- match rows ---------- */
.stageblock{margin-bottom:30px}
.stagehead{display:flex;align-items:center;gap:14px;margin:0 2px 16px;width:100%;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.stagebadge{font-family:var(--disp);font-size:20px;letter-spacing:1px;color:#0A0E1A;background:var(--accent);padding:7px 18px;border-radius:9px;transform:skewX(-7deg);text-transform:uppercase}
.stagebadge>span{display:inline-block;transform:skewX(7deg)}
.stagehead .line{flex:1;height:1px;background:var(--border)}
.stagehead .count{font-family:var(--head);font-size:14px;color:var(--muted);font-weight:700;letter-spacing:2px}
.stagehead .chev{display:inline-flex;color:var(--text2);transition:transform .18s;flex-shrink:0}
.stagehead .chev svg{width:18px;height:18px}
.stagehead.collapsed .chev{transform:rotate(-90deg)}
.matchrow{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;display:grid;
  grid-template-columns:52px 1fr auto 1fr auto;align-items:center;gap:14px;margin-bottom:10px;cursor:pointer;transition:.12s;flex-wrap:wrap}
.matchrow:hover{background:var(--surface2);border-color:var(--border2)}
.matchrow.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);animation:flashpulse 1.4s ease}
@keyframes flashpulse{0%{background:var(--accent-bg)}100%{background:var(--surface)}}
.matchrow .mno{width:46px;height:46px;border-radius:12px;background:var(--accent-bg);border:1px solid var(--accent-bd);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.matchrow .mno b{font-family:var(--disp);font-size:18px;color:var(--accent);line-height:1}
.matchrow .mno span{font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.teams{display:contents}
.team{min-width:0}
.team.a{text-align:right}
.team .tag,.team .chips{font-family:var(--head);font-weight:700;letter-spacing:1px;font-size:11px;text-transform:uppercase;margin-bottom:3px;display:flex;gap:6px;color:var(--muted)}
.team.a .chips{justify-content:flex-end}
.team .players{font-weight:600;font-size:17px;line-height:1.2;color:var(--text)}
.team.win .players{color:var(--win)}
.team .wlabel{font-size:10px;font-weight:800;color:var(--win);text-transform:uppercase;letter-spacing:.04em;display:inline-flex;align-items:center;gap:3px;margin-top:2px}
.team .wlabel svg{width:11px;height:11px}
.score{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:24px;justify-self:center}
.score .s{min-width:26px;text-align:center;color:#fff}
:root[data-theme="light"] .score .s{color:var(--text)}
.score .s.lo{color:var(--muted)}
.score .vs{font-family:var(--disp);font-size:16px;color:#0A0E1A;background:var(--accent);padding:5px 12px;border-radius:7px;transform:skewX(-8deg)}
.score .vs>span{display:inline-block;transform:skewX(8deg)}
.score .pending{font-family:var(--disp);font-size:15px;color:#0A0E1A;background:var(--accent);padding:5px 13px;border-radius:7px;transform:skewX(-8deg)}
.mactions{display:flex;gap:4px;justify-self:end}
.mactions .iconbtn{width:34px;height:34px;border-radius:9px}
.mactions .iconbtn svg{width:15px;height:15px}
.gamedetail{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:11px;margin-top:3px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.gamedetail .g{font-family:var(--disp);color:var(--text2);font-size:14px}
.gamedetail .fmt{margin-left:auto;font-family:var(--head);color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px}
.gamedetail .byline{color:var(--muted);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.gamedetail .byline svg{width:12px;height:12px}
@media(max-width:620px){
  .matchrow{grid-template-columns:46px 1fr auto;gap:8px 12px}
  .team.a{grid-column:2;text-align:left}
  .team.a .chips{justify-content:flex-start}
  .score{grid-column:3;grid-row:1;justify-self:end}
  .team.b{grid-column:2}
  .mactions{grid-column:1/-1;justify-self:end;border-top:1px solid var(--border);padding-top:8px;width:100%}
  .gamedetail .fmt{margin-left:0}
}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:13px 16px;text-align:left;white-space:nowrap}
th{font-family:var(--head);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border)}
td{border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--surface2)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.rankcell{display:flex;align-items:center;gap:12px}
.rankno{width:26px;font-family:var(--disp);color:var(--muted);text-align:center;flex-shrink:0;font-size:16px}
.rankno.top{color:var(--gold)}
.pname{font-weight:600;color:var(--text)}
.pctbar{position:relative;height:6px;border-radius:3px;background:var(--surface2);width:60px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.pctbar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.wl{display:inline-flex;gap:3px;align-items:center}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.pill.w{color:var(--win);background:var(--win-bg)}
.pill.l{color:var(--danger);background:var(--danger-bg)}
.pill.diff{background:var(--surface2);color:var(--text2)}
.pill.diff.pos{color:var(--win);background:var(--win-bg)}
.pill.diff.neg{color:var(--danger);background:var(--danger-bg)}

/* ---------- tournaments ---------- */
.tcard{display:flex;align-items:center;gap:16px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px}
.tcard.cur{border-color:var(--accent-bd);box-shadow:0 0 0 1px var(--accent-bd) inset}
.tcard .tinfo{flex:1;min-width:0}
.tcard .tinfo h3{font-family:var(--head);font-size:19px;font-weight:700;text-transform:uppercase}
.tcard .tinfo .meta{font-size:13px;color:var(--text2);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.statusdot{display:inline-flex;align-items:center;gap:5px}
.statusdot i{width:7px;height:7px;border-radius:50%;background:var(--win)}
.statusdot.done i{background:var(--muted)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:52px 20px;color:var(--text2)}
.empty svg{width:40px;height:40px;color:var(--muted);margin-bottom:12px}
.empty h3{font-family:var(--head);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text);margin-bottom:5px}
.empty p{font-size:14px;max-width:380px;margin:0 auto 16px}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(3,6,12,.66);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;pointer-events:none;transition:opacity .15s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:#0C1324;border:1px solid var(--border2);width:100%;max-width:500px;border-radius:20px 20px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.5);max-height:92vh;overflow-y:auto;transform:translateY(16px);transition:transform .18s}
:root[data-theme="light"] .modal{background:#fff}
.modal-overlay.show .modal{transform:none}
@media(min-width:560px){.modal-overlay{align-items:center;padding:20px}.modal{border-radius:20px}}
.modal-head{display:flex;align-items:center;padding:20px 22px 6px}
.modal-head h3{font-family:var(--head);font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.modal-head .x{margin-left:auto;width:34px;height:34px;border-radius:9px;color:var(--text2)}
.modal-head .x:hover{background:var(--surface2)}
.modal-body{padding:16px 22px 22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);font-size:15px;font-family:inherit;color:var(--text)}
.field textarea{resize:vertical;min-height:120px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent-bd);box-shadow:0 0 0 3px var(--accent-bg)}
.field select option{background:#0C1324;color:var(--text)}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.vsrow .vsbadge{padding-bottom:12px;font-family:var(--disp);color:var(--muted);font-size:14px}
.teamfield{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;background:var(--surface)}
.teamfield .th{font-family:var(--head);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.teamfield.a .th{color:var(--teamA)} .teamfield.b .th{color:var(--teamB)}
.teamfield input,.teamfield select{margin-bottom:9px;background:var(--surface2)}
.teamfield input:last-child,.teamfield select:last-child{margin-bottom:0}
.teamfield select.teamsel{font-weight:700}
.scorebig{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:4px 0 6px}
.scorebig .sc{text-align:center}
.scorebig .sc .lbl{font-family:var(--head);font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.scorebig .sc.a .lbl{color:var(--teamA)} .scorebig .sc.b .lbl{color:var(--teamB)}
.scorebig input{text-align:center;font-family:var(--disp);font-size:30px;padding:10px}
.scorebig .dash{font-family:var(--disp);font-size:24px;color:var(--muted);padding-bottom:4px}
.modal-foot{display:flex;gap:10px;margin-top:8px}
.modal-foot .btn{flex:1;justify-content:center}
.err{color:var(--danger);font-size:13px;font-weight:600;margin-bottom:10px;display:none}
.err.show{display:block}
/* score modal games grid */
.gamegrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:center}
.gamegrid .glbl{font-family:var(--head);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:center;line-height:1.2}
.gamegrid .glbl.a{color:var(--teamA)} .gamegrid .glbl.b{color:var(--teamB)}
.gamegrid .gnum{font-family:var(--head);font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase}
.gamegrid .gin{width:100%;text-align:center;padding:11px;border:1px solid var(--border2);border-radius:var(--radius-xs);background:var(--surface);font-family:var(--disp);font-size:20px;color:var(--text)}
.gamegrid .gin:focus{outline:none;border-color:var(--accent-bd);box-shadow:0 0 0 3px var(--accent-bg)}
.tallyline{font-family:var(--disp);text-align:center;margin:12px 0 2px;color:var(--text2)}
.confirmbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;text-align:center}
.confirmbox .cpair{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.confirmbox .cpair .glbl{font-family:var(--head);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.confirmbox .cpair .glbl.a{color:var(--teamA)} .confirmbox .cpair .glbl.b{color:var(--teamB)}
.confirmbox .cvs{font-family:var(--head);font-size:11px;color:var(--muted);font-weight:700}
.confirmbox .cscore{font-family:var(--disp);font-size:26px;color:var(--text);letter-spacing:1px;font-variant-numeric:tabular-nums;margin:8px 0 2px}
.confirmbox .cres{font-family:var(--disp);color:var(--text2);font-size:15px;margin-top:4px}
.confirmbox .cwin{margin-top:12px;font-weight:700;color:var(--win);background:var(--win-bg);border-radius:999px;padding:7px 16px;display:inline-block;font-size:14px}
/* Score-entry modal → near-fullscreen with big touch targets on phones (desktop unchanged) */
@media(max-width:480px){
  .modal.score-modal{width:100%;max-width:none;height:100vh;height:100dvh;max-height:100dvh;border:none;border-radius:0;transform:none;display:flex;flex-direction:column}
  .modal.score-modal .modal-head{padding:18px 20px 6px}
  .modal.score-modal .modal-body{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:14px 20px calc(20px + env(safe-area-inset-bottom))}
  .modal.score-modal .gamegrid{gap:12px;margin-top:10px}
  .modal.score-modal .gamegrid .glbl{font-size:14px}
  .modal.score-modal .gamegrid .gin{padding:22px 10px;font-size:40px;border-radius:14px;min-height:74px}
  .modal.score-modal #tally{font-size:21px;margin:20px 0 2px}
  .modal.score-modal .confirmbox{padding:22px}
  .modal.score-modal .confirmbox .cscore{font-size:32px}
  .modal.score-modal .modal-foot{margin-top:auto;padding-top:16px;gap:12px}
  .modal.score-modal .modal-foot .btn{padding:18px 16px;font-size:17px;min-height:58px;border-radius:14px}
}
/* player detail */
.pd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px}
@media(max-width:460px){.pd-stats{grid-template-columns:repeat(2,1fr)}}
.pd-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xs);padding:12px;text-align:center}
.pd-stat .v{font-family:var(--disp);font-size:24px}.pd-stat .k{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pd-list{list-style:none}
.pd-list li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.pd-list li:last-child{border:none}
.pd-list .res{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;flex-shrink:0}
.pd-list .res.w{color:var(--win);background:var(--win-bg)}
.pd-list .res.l{color:var(--danger);background:var(--danger-bg)}
.pd-list .mscore{margin-left:auto;font-family:var(--disp);color:var(--text2)}

/* banner / scope / toast */
.banner{background:var(--accent-bg);border:1px solid var(--accent-bd);border-radius:var(--radius-sm);padding:13px 15px;font-size:13px;color:var(--text);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:var(--accent)}
.banner b{font-weight:700}
.banner .x{margin-left:auto;flex-shrink:0;cursor:pointer;opacity:.7}
.scope-seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);padding:3px}
.scope-seg button{padding:8px 14px;font-size:13px;font-weight:600;border-radius:7px;color:var(--text2)}
.scope-seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--accent-ink);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:200;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* avatars */
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;flex-shrink:0;vertical-align:middle;color:#fff;font-weight:700;font-family:'Barlow',sans-serif;line-height:1;border:2px solid rgba(255,255,255,.12)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.rankcell .av{margin:0}
/* image uploader */
.uploader{display:flex;align-items:center;gap:12px}
.uploader .thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.uploader .thumb img{width:100%;height:100%;object-fit:cover}
.uploader .ubtns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(3,6,12,.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .15s}
.lightbox.show{opacity:1;pointer-events:auto}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
.lightbox .lbx{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.lightbox .lbx:hover{background:rgba(255,255,255,.28)}

/* team chips + player links */
.tchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.5px;padding:3px 12px 3px 4px;border-radius:999px;background:var(--tcbg);color:var(--tc);white-space:nowrap;max-width:100%;cursor:pointer;text-transform:uppercase}
.tchip[data-teamnav]:hover{filter:brightness(1.15)}
.tchip i{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-left:5px}
.tchip .tci{width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#000;display:inline-flex;border:1.5px solid var(--tc)}
.tchip .tci img{width:100%;height:100%;object-fit:cover}
.tbadge{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;flex-shrink:0;vertical-align:middle;
  border:2px solid var(--muted);background:#000;font-family:var(--disp);line-height:1}
.tbadge img{width:100%;height:100%;object-fit:cover}
.teamrow .tlogo{width:38px;height:38px;border-radius:9px;border:1px solid var(--border2);background:var(--surface2);overflow:hidden;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;padding:0}
.teamrow .tlogo img{width:100%;height:100%;object-fit:cover}
.pclick{cursor:pointer}
.pclick:hover{text-decoration:underline;text-underline-offset:2px}
.psep{color:var(--muted);font-weight:600}
.pclick.pav{display:inline-flex;align-items:center;gap:7px;vertical-align:middle;max-width:100%}
.pclick.pav .av{flex-shrink:0}
.pclick.pav .pn{white-space:nowrap}
.pclick.pav:hover{text-decoration:none}
.pclick.pav:hover .pn{text-decoration:underline;text-underline-offset:2px}
.players .psep{margin:0 3px}
.team .chips{display:flex;min-width:0}

/* captains */
.capstar{flex-shrink:0;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;opacity:.5;transition:.12s;padding:2px}
.capstar:hover{opacity:1;color:var(--gold);transform:scale(1.15)}
.capstar.on{color:var(--gold);opacity:1}
.captag{display:inline-block;font-family:var(--head);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gold);background:var(--accent-bg);padding:2px 8px;border-radius:5px;margin-left:6px;vertical-align:middle;white-space:nowrap}

/* teams page */
.teamcard{overflow:hidden;padding:0;margin-bottom:18px}
.teamcard-head{display:flex;align-items:center;gap:16px;padding:18px 22px;width:100%;text-align:left;cursor:pointer;border:0;color:inherit;flex-wrap:wrap;font:inherit;border-left:5px solid var(--muted)}
.teamcard-head:hover{filter:brightness(1.08)}
.teamcard-head .chev{display:inline-flex;transition:transform .18s;color:var(--text2);flex-shrink:0}
.teamcard-head .chev svg{width:20px;height:20px}
.teamcard.open .teamcard-head .chev{transform:rotate(180deg)}
.teamcard-head h3{font-family:var(--disp);font-size:24px;font-weight:400;text-transform:uppercase;color:#fff;line-height:1}
:root[data-theme="light"] .teamcard-head h3{color:var(--text)}
.teamcard-head .thd-meta{margin-left:auto;text-align:right}
.teamcard-body{padding:20px 22px}
.teamplayers{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pdrow2{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--border)}
.pdrow2:hover{background:var(--surface2)}
.pdrow2 .pname{flex:1;font-weight:600;font-size:15px;min-width:0}
.teammatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.tmrow{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;cursor:pointer;font-size:14px;background:var(--surface);border:1px solid var(--border)}
.tmrow:hover{background:var(--surface2)}
.tmno{font-family:var(--head);color:var(--tc,var(--muted));font-weight:700;width:30px;height:30px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.tmstage{font-family:var(--head);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);background:var(--surface2);padding:3px 8px;border-radius:999px;flex-shrink:0;white-space:nowrap}
.tmwho{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmsc{margin-left:auto;font-family:var(--disp);flex-shrink:0}
.res{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;flex-shrink:0}
.res.w{color:var(--win);background:var(--win-bg)} .res.l{color:var(--danger);background:var(--danger-bg)}
/* stage format editor */
.stagefmt{display:flex;flex-direction:column;gap:8px}
.sfrow{display:flex;align-items:center;gap:8px}
.sfrow .sflabel{flex:1;font-size:14px;font-weight:600;min-width:0}
.sfrow .sfname{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);font-size:14px;font-weight:600;color:var(--text)}
.sfrow .sfname:focus{outline:none;border-color:var(--accent-bd)}
.sfrow select{padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);font-size:13px;font-weight:600;color:var(--text)}
.sfrow select option{background:#0C1324}
.sfrow .sfbo{width:110px} .sfrow .sfpts{width:88px} .sfrow .sfdel{width:34px;height:34px;flex-shrink:0}
@media(max-width:460px){.sfrow{flex-wrap:wrap}.sfrow .sfname{flex-basis:100%}.sfrow .sfbo,.sfrow .sfpts{flex:1}}
/* top-3 players podium */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);text-align:center;cursor:pointer;transition:.12s}
.pod:hover{background:var(--surface2);border-color:var(--border2);transform:translateY(-2px)}
.pod.first{background:linear-gradient(180deg,var(--accent-bg),var(--surface));border-color:var(--accent-bd);padding-top:26px}
.pod .medal{font-family:var(--disp);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:#0A0E1A}
.pod.p1 .medal{background:#F5C518} .pod.p2 .medal{background:#C7CEDA} .pod.p3 .medal{background:#E0870F;color:#fff}
.pod.p1 .av{border-color:#F5C518!important} .pod.p2 .av{border-color:#C7CEDA!important} .pod.p3 .av{border-color:#E0870F!important}
.pod .av{border-width:3px!important}
.pod .pn{font-weight:700;font-size:16px;line-height:1.1}
.pod .rec{display:flex;gap:4px}
.pod .pct{font-family:var(--disp);font-size:22px;color:var(--accent)}
@media(max-width:520px){ .podium{gap:8px} .pod{padding:12px 6px;gap:5px} .pod.first{padding-top:16px} .pod .pn{font-size:13px} .pod .pct{font-size:18px} }
/* legend + section colors for matches */
.legend{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:22px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
.legend span{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:700;letter-spacing:1px;font-size:13px;text-transform:uppercase}
.legend i{width:12px;height:12px;border-radius:3px}
/* settings */
.set-wrap{max-width:820px;margin:0 auto}
.set-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px;margin-top:16px}
.set-card.danger{background:rgba(255,77,94,.05);border-color:rgba(255,77,94,.25)}
.set-card h2{font-family:var(--head);font-weight:700;letter-spacing:1.5px;font-size:17px;text-transform:uppercase;margin-bottom:16px}
.set-card.danger h2{color:#FF8A96}
.set-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.set-row .sr-main{flex:1;min-width:180px}
.set-row .sr-main .t{font-weight:600;font-size:15px}
.set-row .sr-main .d{font-size:13px;color:var(--text2);margin-top:2px}
.themebtns{display:flex;gap:12px;margin-bottom:6px}
.themebtn{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:14px;color:var(--text2);font-size:14px;font-weight:600}
.themebtn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--text)}
.themebtn svg{width:18px;height:18px}
.accentrow{display:flex;gap:12px}
.accentsw{width:40px;height:40px;border-radius:11px;border:3px solid transparent;cursor:pointer}
.accentsw.on{border-color:#fff}
:root[data-theme="light"] .accentsw.on{border-color:var(--text)}
@media(max-width:600px){
  .header{position:static}
  .tabs{top:0;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .brand .sub{display:none}
  .brand h1{font-size:17px}
  .brand .logo{width:40px;height:40px}
  .tsel select{max-width:48vw}
}

</style>
</head>

<header class="header">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="18" r="3.3" fill="#0A0E1A"/><path d="M12 15 L6 3 M12 15 L9 2.6 M12 15 L12 2.2 M12 15 L15 2.6 M12 15 L18 3" stroke="#0A0E1A" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    <div>
      <h1>JCC Badminton</h1>
      <div class="sub">Tournament Tracker</div>
    </div>
  </div>
  <div class="hcontrols">
    <div class="tsel">
      <label for="tournamentSel">Tournament</label>
      <select id="tournamentSel"></select>
    </div>
    <span id="connPill" class="conn local" title="Data source"><span class="dot"></span><span id="connText">Local</span></span>
    <button id="userPill" class="conn user" title="Set your name — used to label who edits scores"><span class="dot"></span><span id="userText">Log in</span></button>

  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</button>
  <button class="tab" data-tab="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Matches</button>

<script>
/* =================================================================

const SUPABASE_URL = 'https://ufcdtdsdowbrgkgnxqnr.supabase.co';

/* ---------- who's editing (name stamp, per device, no password) ---------- */
const USER_KEY='bad_user';
function getUser(){ try{ return (localStorage.getItem(USER_KEY)||'').trim(); }catch(e){ return ''; } }

/* ---------- admin login (built-in, no Supabase Auth) ----------
   Credentials live in the app_users table; app_login / app_set_user /
   app_remove_user are SECURITY DEFINER functions (passwords never reach
   the browser). Login unlocks editing in the UI; the session lives in
   sessionStorage. Super-admins mark players as admins. ---------------- */
let session=(()=>{ try{ return JSON.parse(sessionStorage.getItem('bad_session')||'null'); }catch(e){ return null; } })();
function saveSession(){ try{ if(session) sessionStorage.setItem('bad_session',JSON.stringify(session)); else sessionStorage.removeItem('bad_session'); }catch(e){} }
/* Roles (super & global-admin are global; others are per-tournament):
   - super: full control, manage access, activity log, create/delete tournaments.
   - global admin: edit & score ANY tournament (not manage-access / structural).
   - admin OF a tournament: full edit of that tournament; team captains are
     admins of their tournament automatically (server computes admin_of as
     explicit grants ∪ captaincy). Admins can add umpires for their tournament.
   - umpire OF a tournament: record scores for that tournament only. */
const isSuper=()=> !!(session && session.is_super);
const isGlobalAdmin=()=> !!(session && session.is_global_admin);               // admin of every tournament
const adminTids=()=> (session && Array.isArray(session.admin_of)) ? session.admin_of : [];     // tournaments this user may fully edit
const umpireTids=()=> (session && Array.isArray(session.umpire_of)) ? session.umpire_of : [];  // tournaments this user may score
const isAdmin=()=> !!(session && (session.is_super || session.is_global_admin || adminTids().length));   // admin of at least one tournament (header cosmetics)
const isAdminFor=(tid)=> !!(session && (session.is_super || session.is_global_admin || adminTids().includes(tid)));
const isUmpire=()=> umpireTids().length>0;
const canScore=(tid)=> isAdminFor(tid) || umpireTids().includes(tid);
const adminName=()=> session ? session.username : null;
function actor(){ return session ? session.username : (getUser()||null); }   // who did an action (admin, umpire, or device name)
async function adminLogin(username,password){ if(!useDB||!sb) return {ok:false,err:'offline'};
  try{ const {data,error}=await sb.rpc('app_login',{u:username,p:password}); if(error) return {ok:false,err:error.message};
    if(data&&data.ok){ session={username:data.username, is_super:data.is_super, is_global_admin:data.is_global_admin, admin_of:data.admin_of||[], umpire_of:data.umpire_of||[], pw:password}; saveSession(); } return data||{ok:false}; }
  catch(e){ return {ok:false,err:e.message}; } }
function adminLogout(){ session=null; saveSession(); location.hash=''; render(); }
async function initAuth(){ return; }   // session restored from sessionStorage above
// edit rights are per-tournament (default: the current tournament); ?local mode has no backend, so allow
function requireAdmin(tid){ tid = tid || state.tournamentId;
  if(!useDB || isAdminFor(tid)) return true;
  if(session){ toast('You can edit only the tournament(s) you manage'); return false; }
  toast('Admin login required'); location.hash='#admin'; render(); return false; }
function requireSuper(){ if(!useDB) return true; if(isSuper()) return true; toast('Super-admin only'); return false; }
function requireScorer(tid){ if(!useDB || canScore(tid)) return true;
  if(session){ toast('You can only record scores for your assigned tournament'); return false; }
  toast('Log in to record scores'); location.hash='#admin'; render(); return false; }
function relTime(iso){ if(!iso) return ''; const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<45) return 'just now'; if(s<90) return '1m ago';
  const m=s/60; if(m<60) return Math.round(m)+'m ago';
  const h=m/60; if(h<24) return Math.round(h)+'h ago';
  const d=h/24; if(d<7) return Math.round(d)+'d ago';
  try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return ''; } }
function renderUserPill(){ const el=document.getElementById('userText'); if(el){ const u=getUser(); el.textContent=u?('Logged in as '+u):'Log in'; const p=document.getElementById('userPill'); if(p){ p.classList.toggle('named',!!u); p.title=u?('Logged in as '+u+' — tap to change'):'Log in — pick who is using this device'; } }
  const ab=document.getElementById('adminBtn'); if(ab){ ab.classList.toggle('active',isAdmin()); ab.title=isAdmin()?('Admin · '+(adminName()||'signed in')):'Admin sign-in'; } }
function openUserModal(afterSet){
  const cur=getUser();
  const names=Object.keys(state.players||{}).sort((a,b)=>a.localeCompare(b));
  const isPlayer = cur && names.includes(cur);
  const otherSel = !!cur && !isPlayer;
  openModal(`<div class="modal-head"><h3>Log in</h3><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <p class="subtle" style="font-size:13.5px;margin-bottom:12px">Pick who's using this device — usually one of the players. Saved on this device only, no password. Labels who records or edits scores.</p>
      <div class="field"><label>I am</label>
        <select id="uPlayer">
          <option value="">— Choose your name —</option>
          ${names.map(n=>`<option value="${esc(n)}" ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}
          <option value="__other__" ${otherSel?'selected':''}>Someone else…</option>
        </select>
      </div>
      <div class="field" id="uOtherField" ${otherSel?'':'hidden'}><label>Name</label><input id="uName" placeholder="e.g. Scorer / Organiser" value="${otherSel?esc(cur):''}" maxlength="40"></div>
      <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="uSave">Save</button></div>
    </div>`);
  const sel=modalEl.querySelector('#uPlayer'), otherField=modalEl.querySelector('#uOtherField');
  const syncOther=()=>{ const o=sel.value==='__other__'; otherField.hidden=!o; if(o) setTimeout(()=>modalEl.querySelector('#uName').focus(),40); };
  sel.addEventListener('change',syncOther);
  setTimeout(()=>sel.focus(),60);
  const save=()=>{ const n = sel.value==='__other__' ? (modalEl.querySelector('#uName').value||'').trim() : sel.value;
    if(!n){ sel.value==='__other__' ? modalEl.querySelector('#uName').focus() : sel.focus(); return; }
    setUser(n); store._audit(cur?'login':'signup',{name:n, prev:cur||null}); closeModal(); renderUserPill(); if(typeof afterSet==='function') afterSet(); };
  modalEl.querySelector('#uSave').onclick=save;
  modalEl.querySelector('#uName')?.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } });
}

/* ---------- images: pick, resize/compress, avatar rendering ---------- */
function pickImage(){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.style.position='fixed'; i.style.left='-9999px'; document.body.appendChild(i); i.onchange=()=>{ const f=(i.files&&i.files[0])||null; i.remove(); res(f); }; i.click(); }); }
function resizeImage(file,max,quality,square){ return new Promise((resolve,reject)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ let sw=img.width,sh=img.height,sx=0,sy=0; if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; } let dw=sw,dh=sh; if(Math.max(dw,dh)>max){ const s=max/Math.max(dw,dh); dw=Math.round(dw*s); dh=Math.round(dh*s); } const c=document.createElement('canvas'); c.width=dw; c.height=dh; const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,dw,dh); ctx.drawImage(img,sx,sy,sw,sh,0,0,dw,dh); URL.revokeObjectURL(url); try{ resolve(c.toDataURL('image/jpeg',quality||0.82)); }catch(e){ reject(e); } }; img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); }; img.src=url; }); }
function colorFor(name){ let h=0; const s=name||''; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return `hsl(${h},50%,45%)`; }
function avatar(name,size){ const u=state.players[name]&&state.players[name].avatar_url; const init=((name||'?').trim().charAt(0)||'?'); return u? `<span class="av" style="width:${size}px;height:${size}px"><img src="${esc(u)}" alt="" loading="lazy"></span>` : `<span class="av ini" style="width:${size}px;height:${size}px;background:${colorFor(name)};font-size:${Math.round(size*0.42)}px">${esc(init)}</span>`; }
function openLightbox(url){ let lb=document.getElementById('lightbox'); if(!lb){ lb=document.createElement('div'); lb.id='lightbox'; lb.className='lightbox'; lb.innerHTML='<button class="lbx" aria-label="Close">✕</button><img alt="">'; document.body.appendChild(lb); lb.addEventListener('click',e=>{ if(e.target===lb||e.target.classList.contains('lbx')){ lb.classList.remove('show'); } }); } lb.querySelector('img').src=url; requestAnimationFrame(()=>lb.classList.add('show')); }

/* ---------- seed data: JCC Badminton Series 2026, Fall Edition ---------- */
function seedData(){
  const tid = 'jcc-2026-fall';
  const t = { id:tid, name:'JCC Badminton Series 2026', edition:'Fall Edition', start_date:'2026-10-10', status:'active', banner_url:null, schedule_url:'assets/jcc-fall-2026-schedule.webp', created_at:nowISO() };
  const g1='Matches 1–9', g2='Sunday Matches', g3='October 17th Weekend';
  const M = [
    [1,g1,'Rajeev','Prakash','Prateek','Ranjith'],
    [2,g1,'Deepak','Gunvansh','Jagdeep','Ankit'],
    [3,g1,'Gaurang','Sameer','Sasi','Prithvi'],
    [4,g1,'Mahesh','Ayas','Bhanu','Harsha'],
    [5,g1,'Prasad','Venky','Ankit','Rohith'],
    [6,g1,'Deepankar','Amogh','Ranjith','Ankur'],
    [7,g1,'Mahesh','Prasad','Jagdeep','Ramana'],
    [8,g1,'Gunvansh','Venky','Harsha','Rohith'],
    [9,g1,'Rajeev','Deepankar','Sasi','Ranjith'],
    [10,g2,'Ayas','Gunvansh','Jagdeep','Bhanu'],
    [11,g2,'Prakash','Amogh','Prateek','Ankur'],
    [12,g2,'Ayas','Deepak','Bhanu','Harsha'],
    [13,g3,'Deepankar','Sameer','Prateek','Rama'],
    [14,g3,'Rajeev','Gaurang','Rama','Prithvi'],
  ];
  const matches = M.map(m=>({ id:uid(), tournament_id:tid, match_no:m[0], group_label:m[1], stage:'League',
    best_of:3, points:21, games:[],
    team1:PLAYER_TEAM[m[2]]||null, team2:PLAYER_TEAM[m[4]]||null,
    team1_p1:m[2], team1_p2:m[3], team2_p1:m[4], team2_p2:m[5],
    score1:null, score2:null, status:'scheduled', created_at:nowISO() }));
  const teams = TEAM_SEED.map(x=>({ tournament_id:tid, name:x.name, color:x.color, captain:null, created_at:nowISO() }));
  const players = {}; Object.keys(PLAYER_TEAM).forEach(n=>{ players[n]={ name:n, avatar_url:null }; });
  const rosters = Object.entries(PLAYER_TEAM).map(([player,team])=>({ tournament_id:tid, player, team }));
  return { tournaments:[t], matches, teams, players, rosters };
}

/* ================================================================
   STORE — unified async API over Supabase OR localStorage
   ================================================================ */
const LS_T='bad_tracker_tournaments', LS_M='bad_tracker_matches', LS_P='bad_tracker_players', LS_TM='bad_tracker_teams', LS_R='bad_tracker_rosters';
const store = {
  async init(){
    if(useDB) return;
    if(localStorage.getItem(LS_T)===null){
      const s = seedData();
      localStorage.setItem(LS_T, JSON.stringify(s.tournaments));
      localStorage.setItem(LS_M, JSON.stringify(s.matches));
      localStorage.setItem(LS_P, JSON.stringify(s.players));
      localStorage.setItem(LS_TM, JSON.stringify(s.teams));
      localStorage.setItem(LS_R, JSON.stringify(s.rosters));
    }
  },
  _lsT(){ try{return JSON.parse(localStorage.getItem(LS_T)||'[]')}catch(e){return []} },
  _lsM(){ try{return JSON.parse(localStorage.getItem(LS_M)||'[]')}catch(e){return []} },
  _saveT(a){ try{localStorage.setItem(LS_T,JSON.stringify(a))}catch(e){} },
  _saveM(a){ try{localStorage.setItem(LS_M,JSON.stringify(a))}catch(e){} },

  async getTournaments(){
    if(useDB){ const {data,error}=await sb.from('tournaments').select('*').order('created_at'); if(error)throw error; return data||[]; }
    return this._lsT().sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  },
  async addTournament(t){
    const rec={ id:useDB?undefined:uid(), name:t.name, edition:t.edition||null, start_date:t.start_date||null, status:t.status||'active', stage_config:t.stage_config||{}, created_at:nowISO() };
    if(useDB){ const {data,error}=await sb.from('tournaments').insert(rec).select().single(); if(error)throw error; return data; }
    const a=this._lsT(); rec.id=uid(); a.push(rec); this._saveT(a); return rec;
  },
  async updateTournament(id,patch){
    if(useDB){ const {error}=await sb.from('tournaments').update(patch).eq('id',id); if(error)throw error; return; }
    const a=this._lsT().map(t=>t.id===id?{...t,...patch}:t); this._saveT(a);
  },
  async deleteTournament(id){
    if(useDB){ await sb.from('matches').delete().eq('tournament_id',id); const {error}=await sb.from('tournaments').delete().eq('id',id); if(error)throw error; return; }
    this._saveT(this._lsT().filter(t=>t.id!==id));
    this._saveM(this._lsM().filter(m=>m.tournament_id!==id));
    this._saveTM(this._lsTM().filter(t=>t.tournament_id!==id));
    this._saveR(this._lsR().filter(r=>r.tournament_id!==id));
  },
  async getMatches(){
    if(useDB){ const {data,error}=await sb.from('matches').select('*').order('match_no'); if(error)throw error; return data||[]; }
    return this._lsM().slice().sort((a,b)=>(a.match_no||0)-(b.match_no||0));
  },
  async addMatch(m){
    const rec={ tournament_id:m.tournament_id, match_no:m.match_no, group_label:m.group_label||null, stage:m.stage||'League',
      best_of:m.best_of||3, points:m.points||21, games:m.games||[],
      team1:m.team1||null, team2:m.team2||null,
      team1_p1:m.team1_p1, team1_p2:m.team1_p2, team2_p1:m.team2_p1, team2_p2:m.team2_p2,
      score1:m.score1??null, score2:m.score2??null, status:m.status||'scheduled',
      updated_by:m.updated_by||null, updated_at:m.updated_at||null, created_at:nowISO() };
    if(useDB){ const {data,error}=await sb.from('matches').insert(rec).select().single(); if(error)throw error; return data; }
    rec.id=uid(); const a=this._lsM(); a.push(rec); this._saveM(a); return rec;
  },
  async updateMatch(id,patch){
    if(useDB){ const {error}=await sb.from('matches').update(patch).eq('id',id); if(error)throw error; return; }
    const a=this._lsM().map(m=>m.id===id?{...m,...patch}:m); this._saveM(a);
  },
  async deleteMatch(id){
    if(useDB){ const {error}=await sb.from('matches').delete().eq('id',id); if(error)throw error; return; }
    this._saveM(this._lsM().filter(m=>m.id!==id));
  },
  async applyStageFormat(tid, stage, best_of, points){
    if(useDB){ const {error}=await sb.from('matches').update({best_of,points}).eq('tournament_id',tid).eq('stage',stage).neq('status','completed'); if(error)throw error; return; }
    this._saveM(this._lsM().map(m=>(m.tournament_id===tid && (m.stage||'League')===stage && m.status!=='completed')?{...m,best_of,points}:m));
  },
  async renameStage(tid, oldName, newName){
    if(useDB){ const {error}=await sb.from('matches').update({stage:newName}).eq('tournament_id',tid).eq('stage',oldName); if(error)throw error; return; }
    this._saveM(this._lsM().map(m=>(m.tournament_id===tid && (m.stage||'League')===oldName)?{...m,stage:newName}:m));
  },
  _lsP(){ try{return JSON.parse(localStorage.getItem(LS_P)||'{}')}catch(e){return {}} },
  _saveP(o){ try{localStorage.setItem(LS_P,JSON.stringify(o)); return true;}catch(e){return false;} },
  _lsR(){ try{return JSON.parse(localStorage.getItem(LS_R)||'[]')}catch(e){return []} },
  _saveR(a){ try{localStorage.setItem(LS_R,JSON.stringify(a))}catch(e){} },
  async getPlayers(){
    if(useDB){ const {data,error}=await sb.from('players').select('name,avatar_url'); if(error){console.warn('players:',error.message);return {};} const o={}; (data||[]).forEach(p=>o[p.name]={name:p.name,avatar_url:p.avatar_url}); return o; }
    const o=this._lsP(); Object.values(o).forEach(p=>{ delete p.team; }); return o;
  },
  // per-tournament roster membership (one row per player per tournament; team may be null)
  async getRosters(){
    if(useDB){ const {data,error}=await sb.from('rosters').select('*'); if(error){console.warn('rosters:',error.message);return [];} return data||[]; }
    return this._lsR();
  },
  async setPlayerAvatar(name,url){
    if(useDB){ const {error}=await sb.from('players').upsert({name,avatar_url:url},{onConflict:'name'}); if(error)throw error; return; }
    const o=this._lsP(); o[name]=Object.assign({name,avatar_url:null},o[name],{avatar_url:url}); if(!this._saveP(o)) throw new Error('Image too large for on-device mode. Connect Supabase to store photos.');
  },

      const {data:rs}=await sb.from('rosters').select('player,team').eq('tournament_id',fromTid);
      if(rs&&rs.length){ const {error}=await sb.from('rosters').upsert(rs.map(r=>({tournament_id:toTid,player:r.player,team:r.team||null})),{onConflict:'tournament_id,player'}); if(error)throw error; }
      return;

    const tm=this._lsTM(); tm.filter(t=>t.tournament_id===fromTid).forEach(t=>{ if(!tm.find(x=>x.tournament_id===toTid&&x.name===t.name)) tm.push({tournament_id:toTid,name:t.name,color:t.color,captain:t.captain||null,logo:t.logo||null,created_at:nowISO()}); }); this._saveTM(tm);
    const ro=this._lsR(); ro.filter(r=>r.tournament_id===fromTid).forEach(r=>{ if(!ro.find(x=>x.tournament_id===toTid&&x.player===r.player)) ro.push({tournament_id:toTid,player:r.player,team:r.team||null}); }); this._saveR(ro);

  async saveImage(dataUrl,path){

};

/* ================================================================

store._audit = async function(action, detail){
  if(!useDB || !sb) return;
  try{ await sb.from('audit_log').insert({ actor:(typeof actor==='function'?actor():'')||null, action, detail:detail||null }); }catch(e){}
};
(function(){
  const sanit=v=>{ try{ return JSON.parse(JSON.stringify(v,(k,val)=> (typeof val==='string'&&val.length>180)?('['+val.length+' chars]'):val)); }catch(e){ return null; } };
  const MUT={ addTournament:'tournament.create', updateTournament:'tournament.update', deleteTournament:'tournament.delete',
    addMatch:'match.create', updateMatch:'match.update', deleteMatch:'match.delete',
    addPlayer:'player.create', addPlayers:'player.import', removePlayer:'player.delete', renamePlayer:'player.rename',
    setRoster:'roster.set', setPlayerAvatar:'player.photo',
    addTeam:'team.create', updateTeam:'team.update', removeTeam:'team.delete', copyTeamsAndRosters:'tournament.copy' };
  Object.keys(MUT).forEach(fn=>{ const orig=store[fn]; if(typeof orig!=='function') return;
    store[fn]=async function(...args){ const r=await orig.apply(this,args);
      try{ let act=MUT[fn];
        if(fn==='updateMatch'){ const p=args[1]||{}; if('games' in p || 'status' in p) act='match.score'; }
        if(fn==='updateTeam'){ const p=args[2]||{}; if('captain' in p) act='team.captain'; else if('logo' in p) act='team.logo'; else if('name' in p) act='team.rename'; }
        this._audit(act, sanit(args)); }catch(e){}
      return r; }; });
})();

const state = { tab:'dashboard', tournamentId:null, scope:'tournament', tournaments:[], matches:[], players:{}, teams:[], rosters:[] };

async function loadAll(){
  const [ts,ms,ps,tm,rs] = await Promise.all([store.getTournaments(), store.getMatches(), store.getPlayers(), store.getTeams(), store.getRosters()]);
  state.tournaments=ts; state.matches=ms; state.players=ps||{}; state.teams=tm||[]; state.rosters=rs||[];
  if(!state.tournamentId || !state.tournaments.find(t=>t.id===state.tournamentId)){
    const active = state.tournaments.find(t=>t.status==='active') || state.tournaments[0];
    state.tournamentId = active ? active.id : null;
  }
}
const curTournament = () => state.tournaments.find(t=>t.id===state.tournamentId) || null;
function scopedMatches(){
  if(state.scope==='all') return state.matches;
  return state.matches.filter(m=>m.tournament_id===state.tournamentId);
}
function tournamentMatches(){ return state.matches.filter(m=>m.tournament_id===state.tournamentId); }
// next match still needing a score, in Matches-tab display order (match_no asc), after a given match id
function nextPendingMatchAfter(afterId){
  const list=tournamentMatches().slice().sort((a,b)=>(a.match_no||0)-(b.match_no||0)||(a.created_at||'').localeCompare(b.created_at||''));
  const idx=list.findIndex(m=>m.id===afterId);
  for(let i=(idx<0?0:idx+1);i<list.length;i++){ if(list[i].status!=='completed') return list[i].id; }
  return null;
}
// ---- multi-game scoring (best of N, each game to 15/21) ----
const bestOf   = m => m.best_of || 3;
const needGames = m => Math.ceil(bestOf(m)/2);           // games required to win the match
function gamesOf(m){
  if(Array.isArray(m.games) && m.games.length) return m.games.filter(g=>g && g.s1!=null && g.s2!=null && g.s1!=='' && g.s2!=='');
  if(m.score1!=null && m.score2!=null) return [{s1:m.score1, s2:m.score2}]; // back-compat: old single-game rows
  return [];
}
// a game is won when the winner reaches the target points (15/21) AND leads by 2 (deuce: play on past the target until a 2-point lead)
function gameWin(g,pts){ const s1=+g.s1, s2=+g.s2; if(isNaN(s1)||isNaN(s2)||s1===s2) return 0; const hi=Math.max(s1,s2), lo=Math.min(s1,s2); if(hi < (pts||21) || hi-lo < 2) return 0; return s1>s2?1:2; }
function gamesWon(m){ const pts=m.points||21; let a=0,b=0; gamesOf(m).forEach(g=>{ const w=gameWin(g,pts); if(w===1)a++; else if(w===2)b++; }); return {a,b}; }
function pointsOf(m){ let a=0,b=0; gamesOf(m).forEach(g=>{ a+=(+g.s1||0); b+=(+g.s2||0); }); return {a,b}; }
function winnerOf(m){
  if(m.status!=='completed') return null;
  const {a,b}=gamesWon(m);
  return a>b?1:(b>a?2:0);
}
// small gold trophy marker for winners — reused everywhere a result/leader is shown
function goldTrophy(px){ return I.trophy.replace('<svg','<svg aria-label="Winner" style="width:'+(px||14)+'px;height:'+(px||14)+'px;color:var(--accent);flex:none;vertical-align:-2px;display:inline-block"'); }

// ---- teams (franchises) — per-tournament ----
const curTeams = () => state.teams.filter(t=>t.tournament_id===state.tournamentId);
const teamsForTour = tid => state.teams.filter(t=>t.tournament_id===tid);
// a player's team IN A GIVEN tournament (default: current). Players are global; membership is per-tournament.
function teamOfIn(tid,name){ const r=state.rosters.find(x=>x.tournament_id===tid && x.player===name); return r ? (r.team||null) : null; }
const teamOf = name => teamOfIn(state.tournamentId, name);
const teamColor = t => { const x=curTeams().find(x=>x.name===t); return x?x.color:'#8a94a2'; };
// ---- captains (per-tournament) ---- a team's captain, but only if they're still on that team
function captainOf(teamName){ const t=curTeams().find(x=>x.name===teamName); const c=t&&t.captain; return (c && teamOf(c)===teamName) ? c : null; }
const isCaptain = name => curTeams().some(t=>t.captain===name && teamOf(name)===t.name);
async function setCaptainFlow(teamName, playerName){
  if(!requireAdmin()) return;
  const t=curTeams().find(x=>x.name===teamName); if(!t) return;
  const cur=captainOf(teamName);
  let next, msg;
  if(cur===playerName){ next=null; msg=`Remove ${playerName} as captain of ${teamName}?`; }
  else { next=playerName; msg = cur ? `Make ${playerName} captain of ${teamName}, replacing ${cur}?` : null; }
  if(msg && !confirm(msg)) return;
  try{ await store.updateTeam(state.tournamentId, teamName,{captain:next}); await loadAll(); render(); toast(next?`${playerName} is now captain`:'Captain removed'); }
  catch(e){ const m=(e&&e.message)||''; toast(/captain|column|schema/i.test(m)?'Run migrate4.sql on Supabase first':'Could not update captain'); }
}
function sideTeam(m, side){
  const stored = side===1 ? m.team1 : m.team2;
  if(stored) return stored;
  const names = side===1 ? [m.team1_p1,m.team1_p2] : [m.team2_p1,m.team2_p2];
  const ts=[...new Set(names.filter(Boolean).map(teamOf).filter(Boolean))];
  return ts.length===1 ? ts[0] : null;
}
function fixtureKey(m){ const a=sideTeam(m,1), b=sideTeam(m,2); return (a&&b) ? [a,b].sort().join(' ~|~ ') : '~other~'; }
// sequential number within the match's stage (1,2,3…) so matches read in order
function pairNoFor(m){
  const st=m.stage||'League';
  const peers=state.matches.filter(x=>x.tournament_id===m.tournament_id && (x.stage||'League')===st)
    .sort((a,b)=>(a.match_no||0)-(b.match_no||0)||(a.created_at||'').localeCompare(b.created_at||''));
  const i=peers.findIndex(x=>x.id===m.id);
  return i>=0 ? i+1 : (m.match_no||'');
}
function teamLogoUrl(name){ const t=curTeams().find(x=>x.name===name); return (t&&t.logo)||null; }
// a team's icon: uploaded logo, else a color tile with the team initial
function teamBadge(name,size){ const c=teamColor(name); const url=teamLogoUrl(name); const s=size||40;

function teamChip(name){ if(!name) return ''; const c=teamColor(name); const url=teamLogoUrl(name);
  const icon = url ? `<span class="tci"><img src="${esc(url)}" alt="" loading="lazy"></span>` : `<i style="background:${c}"></i>`;

// clickable player name(s) — deep-link to the player's card
function playerLink(n){ return n? `<span class="pclick" data-player="${esc(n)}">${esc(n)}</span>` : ''; }
function playersLinked(p1,p2){ return [p1,p2].filter(Boolean).map(playerLink).join('<span class="psep"> / </span>'); }
// clickable player with avatar + name (for match rows)
function playerAvLink(n,size){ return n? `<span class="pclick pav" data-player="${esc(n)}">${avatar(n,size||22)}<span class="pn">${esc(n)}</span></span>` : ''; }
function playersAv(p1,p2){ return [p1,p2].filter(Boolean).map(n=>playerAvLink(n)).join('<span class="psep">/</span>'); }
function computeTeamStats(ms){
  const T={}; const get=n=>(T[n]||(T[n]={name:n,played:0,won:0,lost:0,pf:0,pa:0}));
  ms.forEach(m=>{ const w=winnerOf(m); if(!w) return; const a=sideTeam(m,1), b=sideTeam(m,2); if(!a||!b||a===b) return;
    const pts=pointsOf(m); const A=get(a),B=get(b); A.played++;B.played++; A.pf+=pts.a;A.pa+=pts.b; B.pf+=pts.b;B.pa+=pts.a;
    if(w===1){A.won++;B.lost++;}else{A.lost++;B.won++;} });
  const arr=Object.values(T).map(t=>({...t,diff:t.pf-t.pa,pct:t.played?t.won/t.played:0}));
  arr.sort((a,b)=>b.won-a.won||b.pct-a.pct||b.diff-a.diff||a.name.localeCompare(b.name));
  return arr;
}
// Overall captain performance ACROSS ALL tournaments: each captain's teams' combined record.
function computeCaptainsOverall(){
  const byTour={}, agg={};
  state.teams.forEach(tm=>{
    const cap=tm.captain; if(!cap) return;
    if(teamOfIn(tm.tournament_id,cap)!==tm.name) return;   // captain must be on that team in that tournament
    if(!byTour[tm.tournament_id]) byTour[tm.tournament_id]=computeTeamStats(state.matches.filter(m=>m.tournament_id===tm.tournament_id));
    const ts=byTour[tm.tournament_id].find(x=>x.name===tm.name)||{played:0,won:0,lost:0,pf:0,pa:0};
    const a=agg[cap]||(agg[cap]={name:cap,tours:new Set(),played:0,won:0,lost:0,pf:0,pa:0});
    a.tours.add(tm.tournament_id); a.played+=ts.played; a.won+=ts.won; a.lost+=ts.lost; a.pf+=ts.pf; a.pa+=ts.pa;
  });
  return Object.values(agg).map(a=>({name:a.name,tcount:a.tours.size,played:a.played,won:a.won,lost:a.lost,diff:a.pf-a.pa,pct:a.played?a.won/a.played:0}))
    .sort((x,y)=>y.won-x.won||y.pct-x.pct||y.diff-x.diff||x.name.localeCompare(y.name));
}
// per-stage default format (best-of + points), configured on the tournament
function stageFormat(t, stage){ const c=(t&&t.stage_config&&t.stage_config[stage])||null; return { best_of:(c&&c.best_of)||3, points:(c&&c.points)||21 }; }
// a tournament's stages (ordered): defined in stage_config, plus any stage used by its matches, else the defaults
function tournamentStages(t){
  const cfg=(t&&t.stage_config)||{};
  const used=new Set(state.matches.filter(m=>m.tournament_id===(t&&t.id)).map(m=>m.stage||'League'));
  const names=new Set([...Object.keys(cfg), ...used]);
  if(!names.size) STAGES.forEach(s=>names.add(s));
  const defIdx=n=>{ const i=STAGES.indexOf(n); return i<0?500:i; };
  return [...names].map(name=>{ const c=cfg[name]||{}; return { name, best_of:c.best_of||3, points:c.points||21, order:(c.order!=null?c.order:defIdx(name)) }; })
    .sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name));
}
const tStageNames = t => tournamentStages(t).map(s=>s.name);

/* ================================================================
   ANALYTICS
   ================================================================ */
function computeStats(matches){
  const P = {};
  const get = n => (P[n] || (P[n] = { name:n, played:0, won:0, lost:0, pf:0, pa:0, partners:{}, matches:[] }));
  matches.forEach(m=>{
    const w = winnerOf(m); if(w===null||w===0) return;
    const pts=pointsOf(m);
    const t1=[m.team1_p1,m.team1_p2].filter(Boolean), t2=[m.team2_p1,m.team2_p2].filter(Boolean);
    const rec=(names, mine, theirs, won, partner)=>{ names.forEach(n=>{ const p=get(n); p.played++; won?p.won++:p.lost++; p.pf+=mine; p.pa+=theirs;
      const parts=names.filter(x=>x!==n); parts.forEach(pt=>{ p.partners[pt]=p.partners[pt]||{w:0,g:0}; p.partners[pt].g++; if(won)p.partners[pt].w++; });
      p.matches.push({ m, won, mine, theirs, partner:parts[0]||null }); }); };
    rec(t1, pts.a, pts.b, w===1); rec(t2, pts.b, pts.a, w===2);
  });
  const arr = Object.values(P).map(p=>({ ...p, diff:p.pf-p.pa, pct: p.played? p.won/p.played : 0 }));
  arr.sort((a,b)=> b.won-a.won || b.pct-a.pct || b.diff-a.diff || a.name.localeCompare(b.name));
  return arr;
}
function allPlayerNames(){
  const s=new Set();
  state.matches.forEach(m=>['team1_p1','team1_p2','team2_p1','team2_p2'].forEach(k=>{ if(m[k]) s.add(m[k]); }));
  Object.keys(state.players).forEach(n=>s.add(n));
  return [...s].sort((a,b)=>a.localeCompare(b));
}
// Full roster for a set of matches: everyone who appears in them, plus every
// player added to the roster directly (players table). Shown even with 0 games.
function rosterNames(ms){
  const s=new Set();
  ms.forEach(m=>['team1_p1','team1_p2','team2_p1','team2_p2'].forEach(k=>{ if(m[k]) s.add(m[k]); }));
  Object.keys(state.players).forEach(n=>s.add(n));
  return [...s];
}
function matchCountFor(name){

}
const zeroStats = name => ({ name, played:0, won:0, lost:0, pf:0, pa:0, diff:0, pct:0, partners:{}, matches:[] });
