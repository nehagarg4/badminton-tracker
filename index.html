function fmtDate(d){ if(!d) return ''; try{ return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }catch(e){return d;} }
const team = (p1,p2)=> [p1,p2].filter(Boolean).join(' / ');

function renderHeader(){
  const sel=document.getElementById('tournamentSel');
  sel.innerHTML = state.tournaments.map(t=>`<option value="${t.id}" ${t.id===state.tournamentId?'selected':''}>${esc(t.name)}${t.edition?' · '+esc(t.edition):''}</option>`).join('')
    || '<option>No tournaments</option>';
}

const isAdminRoute=()=> location.hash==='#admin' || /\/admin\/?$/.test(location.pathname);
function render(){
  renderHeader(); renderUserPill();
  const asc=document.getElementById('adminScreen'), main=document.querySelector('main.wrap');
  if(isAdminRoute()){ main.style.display='none'; asc.style.display='block';
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='admin'));
    renderAdmin(asc); return; }
  main.style.display=''; asc.style.display='none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const pg=document.getElementById('page-'+state.tab); pg.classList.add('active');
  ({dashboard:renderDashboard, matches:renderMatches, players:renderPlayers, teams:renderTeams, tournaments:renderTournaments, settings:renderSettings}[state.tab])(pg);
}

/* ---- Admin (/admin or #admin) ---- */
function renderAdmin(el){
  const back=`<button class="btn sm" id="adBack">${session?'Back to app':'Back'}</button>`;
  if(!useDB){ el.innerHTML=`<div class="wrap"><div class="set-wrap"><div class="sectionhead"><h2>Admin</h2><div class="spacer"></div>${back}</div><div class="set-card"><p class="subtle">Admin login needs the live site (Supabase). You're in on-device mode.</p></div></div></div>`; el.querySelector('#adBack').onclick=()=>{ location.hash=''; render(); }; return; }

  if(!session){
    el.innerHTML=`<div class="wrap"><div class="set-wrap" style="max-width:440px">
      <div class="sectionhead"><h2>Admin</h2><div class="spacer"></div>${back}</div>
      <div class="set-card"><h2>Sign in</h2>
        <div class="err" id="adErr"></div>
        <div id="adPick"><p class="subtle">Loading…</p></div>
        <div class="field" style="margin-top:14px"><label>Password</label><input id="adPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
        <div class="modal-foot"><button class="btn primary" id="adGo" style="flex:1;justify-content:center">Sign in</button></div>
      </div></div></div>`;
    el.querySelector('#adBack').onclick=()=>{ location.hash=''; render(); };
    (async()=>{ let names=[]; try{ const {data}=await sb.rpc('app_admin_names'); names=Array.isArray(data)?data:[]; }catch(e){}
      const box=el.querySelector('#adPick'); if(!box) return;
      if(!names.length){ box.innerHTML=`<div class="field"><label>Username</label><input id="adUser" type="text" placeholder="username"></div><div class="hint">No admins set up yet — run migrate10.sql (it creates the first super-admin).</div>`; return; }
      box.innerHTML=`<div class="field"><label>Who are you?</label>
        <div style="display:flex;align-items:center;gap:12px"><span id="adAv">${avatar(names[0],44)}</span>
        <select id="adUser" style="flex:1">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div></div>`;
      const sel=box.querySelector('#adUser'); sel.onchange=()=>{ box.querySelector('#adAv').innerHTML=avatar(sel.value,44); };
      setTimeout(()=>el.querySelector('#adPass').focus(),60);
    })();
    const go=async()=>{ const u=(el.querySelector('#adUser')?.value||'').trim(), p=el.querySelector('#adPass').value||''; const err=el.querySelector('#adErr');
      if(!u||!p){ err.textContent='Pick your name and enter your password.'; err.classList.add('show'); return; }
      const btn=el.querySelector('#adGo'); btn.disabled=true; btn.textContent='Signing in…';
      const res=await adminLogin(u,p);
      if(!res.ok){ err.textContent='Wrong username or password.'; err.classList.add('show'); btn.disabled=false; btn.textContent='Sign in'; store._audit('login_failed',{username:u}); return; }
      store._audit('login',{username:u}); render(); };
    el.querySelector('#adGo').onclick=go;
    el.querySelector('#adPass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    return;
  }

  const tName=tid=>{ const t=(state.tournaments||[]).find(x=>x.id===tid); return t?t.name:null; };
  const role = isSuper()?'Super-admin':(isGlobalAdmin()?'Admin (all tournaments)':(adminTids().length?'Admin':'Umpire'));
  const roleDesc = isSuper()?'full control' : (isGlobalAdmin()?'you can edit &amp; score any tournament' : (adminTids().length?'you manage your tournament(s)':'you can record scores for your assigned tournament(s)'));
  const adNames = adminTids().map(tName).filter(Boolean);
  const umpNames = umpireTids().map(tName).filter(Boolean);
  const canReset = isAdminFor(state.tournamentId);
  const roleLines=[];
  if(!isSuper() && adNames.length) roleLines.push(`<div class="hint" style="margin-top:10px">Admin for: ${adNames.map(n=>`<span class="captag">${esc(n)}</span>`).join(' ')} — edit matches, teams &amp; scores there.</div>`);
  if(umpNames.length) roleLines.push(`<div class="hint" style="margin-top:10px">Umpire for: ${umpNames.map(n=>`<span class="captag">${esc(n)}</span>`).join(' ')} — open <b>Matches</b> to record scores.</div>`);
  if(isGlobalAdmin()) roleLines.push(`<div class="hint" style="margin-top:10px">You can record &amp; edit scores for <b>every</b> tournament.</div>`);
  if(!isSuper() && !isGlobalAdmin() && !adNames.length && !umpNames.length) roleLines.push(`<div class="hint" style="margin-top:10px">No tournaments assigned yet — you're an admin automatically for any tournament where you're a team captain; otherwise ask a super-admin.</div>`);
  el.innerHTML=`<div class="wrap"><div class="set-wrap">
    <div class="sectionhead"><h2>Admin</h2><div class="spacer"></div>${back}</div>
    <div class="set-card"><div class="set-row">${avatar(session.username,44)}<div class="sr-main"><div class="t">${esc(session.username)}</div><div class="d">${role} · ${roleDesc}</div></div><button class="btn sm danger" id="adLogout" style="flex:none">Log out</button></div>
      ${roleLines.join('')}
    </div>
    ${isSuper()?`<div class="set-card"><h2>Manage access <span class="captag">Super</span></h2><div id="adMgr"><p class="subtle">Loading…</p></div></div>`:''}
    ${(!isSuper()&&(isGlobalAdmin()||adminTids().length))?`<div class="set-card"><h2>Manage admins &amp; umpires</h2><div class="d" style="font-size:13px;color:var(--text2)">Open <b>Tournaments</b>, edit a tournament you manage, and set its admins &amp; umpires there.</div></div>`:''}
    ${canReset?`<div class="set-card danger"><h2>Danger zone</h2>
      <div class="set-row"><div class="sr-main"><div class="d" style="max-width:440px">Reset all recorded scores for <b>${curTournament()?esc(curTournament().name):'the current tournament'}</b>. Players &amp; teams are kept.</div></div><button class="btn sm danger" id="adReset" style="flex:none">Reset scores</button></div>
    </div>`:''}
    ${isSuper()?`<div class="set-card"><h2>Activity log <span class="captag">Super</span></h2><div id="adLog"><p class="subtle">Loading…</p></div></div>`:''}
  </div></div>`;
  el.querySelector('#adBack').onclick=()=>{ location.hash=''; render(); };
  el.querySelector('#adLogout').onclick=()=>{ store._audit('logout',{username:session.username}); adminLogout(); };
  el.querySelector('#adReset')?.addEventListener('click',async()=>{ const t=curTournament(); if(!t) return; if(!confirm(`Reset scores for all ${tournamentMatches().length} matches in "${t.name}"? Cannot be undone.`)) return; try{ for(const m of tournamentMatches()) await store.updateMatch(m.id,{games:[],score1:null,score2:null,status:'scheduled'}); await loadAll(); toast('Scores reset'); renderAdmin(el); }catch(e){ toast('Could not reset'); } });
  if(isSuper()) renderAccessMgr(el.querySelector('#adMgr'));
  if(isSuper()) (async()=>{ const box=el.querySelector('#adLog'); if(!box) return; try{ const {data,error}=await sb.rpc('app_audit',{su:session.username,sp:session.pw,lim:150});
    if(error||!data||!data.ok){ box.innerHTML=`<p class="subtle">Could not load the log${error?' ('+esc(error.message)+')':''}. Run the latest migration (migrate13.sql).</p>`; return; }
    const rows=data.rows||[];
    if(!rows.length){ box.innerHTML='<p class="subtle">No activity recorded yet.</p>'; return; }
    box.innerHTML=`<div class="tablewrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="white-space:nowrap">${esc(new Date(r.created_at).toLocaleString())}</td><td>${esc(r.actor||'—')}</td><td><span class="tmstage">${esc(r.action)}</span></td><td class="subtle" style="max-width:320px;overflow:hidden;text-overflow:ellipsis">${esc(JSON.stringify(r.detail||{}))}</td></tr>`).join('')}</tbody></table></div>`;
  }catch(e){ box.innerHTML='<p class="subtle">Could not load the log.</p>'; } })();
}
async function renderAccessMgr(box){
  if(!box) return;
  let users=[]; try{ const {data}=await sb.rpc('app_list_users',{su:session.username,sp:session.pw}); if(data&&data.ok) users=data.users||[]; }catch(e){}
  users=users.filter(u=>u.is_super||u.is_admin);
  const players=Object.keys(state.players).sort((a,b)=>a.localeCompare(b));
  const ps='padding:10px 12px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);color:var(--text)';
  const rowHtml=u=>{
    return `<div class="set-row" style="padding:8px 0;border-bottom:1px solid var(--border);align-items:flex-start">
      <div class="sr-main" style="display:flex;align-items:flex-start;gap:10px">${avatar(u.username,30)}<div style="min-width:0"><div class="t">${esc(u.username)}${u.is_super?' <span class="captag">super</span>':''}${(u.is_admin&&!u.is_super)?' <span class="captag">admin · all</span>':''}</div>
      </div></div>
      ${u.username.toLowerCase()===session.username.toLowerCase()?'<span class="subtle">you</span>':`<button class="btn sm ghost danger uRm" data-u="${esc(u.username)}" style="flex:none">Remove</button>`}
    </div>`;
  };
  box.innerHTML=`
    <div id="usersBox">${users.length?users.map(rowHtml).join(''):'<p class="subtle">No users yet.</p>'}</div>
    <div class="hint" style="margin:14px 0 8px">Per-tournament <b>admins</b> and <b>umpires</b> are managed on each tournament's edit screen (<b>Tournaments → edit</b>). Captains are admins of their tournament automatically. Below you set <b>global</b> roles only.</div>
    <div class="hint" style="margin:0 0 8px">Make a <b>global admin</b> (edit &amp; score every tournament) or a <b>super-admin</b> (also manage access + activity log + create/delete tournaments), or just create a login. Blank password on an existing user only toggles the checkboxes.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="sName" style="flex:1;min-width:130px">${players.map(n=>`<option>${esc(n)}</option>`).join('')}</select>
      <input id="sPass" type="text" placeholder="password" style="flex:1;min-width:110px;${ps}">
      <label class="subtle" style="display:flex;align-items:center;gap:6px;white-space:nowrap"><input type="checkbox" id="sAdmin"> admin&nbsp;(all)</label>
      <label class="subtle" style="display:flex;align-items:center;gap:6px;white-space:nowrap"><input type="checkbox" id="sSuper"> super</label>
      <button class="btn sm primary" id="sSave" style="flex:none">Save</button>
    </div>`;
  box.querySelectorAll('.uRm').forEach(b=>b.onclick=async()=>{ if(!confirm(`Remove ${b.dataset.u}? This removes all their access.`)) return;
    try{ const {data}=await sb.rpc('app_remove_user',{su:session.username,sp:session.pw,target:b.dataset.u}); if(data&&data.ok){ store._audit('admin.remove',{username:b.dataset.u}); renderAccessMgr(box); toast('Removed'); } else toast('Could not remove'); }catch(e){ toast('Could not remove'); } });
  box.querySelector('#sSave').onclick=async()=>{ const name=box.querySelector('#sName').value, pass=box.querySelector('#sPass').value||'', adm=box.querySelector('#sAdmin').checked, sup=box.querySelector('#sSuper').checked;
    if(!name){ toast('Pick a name'); return; }
    try{ const {data}=await sb.rpc('app_set_user',{su:session.username,sp:session.pw,target:name,pass:pass,admin:adm,super:sup}); if(data&&data.ok){ store._audit('super.set',{username:name,admin:adm,super:sup}); renderAccessMgr(box); toast('Saved'); } else toast((data&&data.err)||'Could not save'); }catch(e){ toast('Could not save'); } };
}
// Per-tournament admins + umpires, shown inside the tournament edit modal. Changes apply immediately.
async function renderTournamentPeople(tid, box){
  if(!box) return;
  if(!useDB||!sb){ box.innerHTML='<p class="subtle">Available on the live site.</p>'; return; }
  const su=session?session.username:'', sp=session?session.pw:'';
  const players=Object.keys(state.players).sort((a,b)=>a.localeCompare(b));
  const ps='padding:9px 11px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);color:var(--text)';
  let explicit=[], captains=[], umps=[];
  try{ const {data}=await sb.rpc('app_list_admins',{su,sp,tid}); if(data&&data.ok){ explicit=data.explicit||[]; captains=data.captains||[]; } }catch(e){}
  try{ const {data}=await sb.rpc('app_list_umpires',{su,sp,tid}); if(data&&data.ok) umps=data.umpires||[]; }catch(e){}
  // captains now arrive as {name, has_login}; tolerate old plain-string shape too
  const caps=captains.map(c=>typeof c==='string'?{name:c,has_login:true}:c);
  const capLc=caps.map(c=>c.name.toLowerCase());
  const row=(n,badge,rmCls)=>`<div class="set-row" style="padding:6px 0;border-bottom:1px solid var(--border)"><div class="sr-main" style="display:flex;align-items:center;gap:8px">${avatar(n,26)}<span class="t">${esc(n)}</span>${badge||''}</div>${rmCls?`<button class="btn sm ghost danger ${rmCls}" data-u="${esc(n)}" style="flex:none">Remove</button>`:'<span class="subtle" style="font-size:11px">auto</span>'}</div>`;
  // captain with a login = auto-admin (read-only); captain without = offer to create one
  const capRow=(c)=> c.has_login ? row(c.name,'<span class="captag">captain</span>',null)
    : `<div class="set-row" style="padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px"><div class="sr-main" style="display:flex;align-items:center;gap:8px">${avatar(c.name,26)}<span class="t">${esc(c.name)}</span><span class="captag">captain</span></div><div style="display:flex;gap:6px;flex:none;align-items:center"><input class="tpCapPass" type="text" placeholder="set password" style="width:120px;${ps}"><button class="btn sm primary tpCapEnable" data-u="${esc(c.name)}" style="flex:none">Enable login</button></div></div>`;
  const admRows = caps.map(capRow).join('')
    + explicit.filter(n=>!capLc.includes(n.toLowerCase())).map(n=>row(n,'','tpAdmRm')).join('');
  box.innerHTML=`
    <div style="font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--text2);margin:2px 0 4px">ADMINS <span class="subtle" style="font-weight:600;letter-spacing:0">· full edit of this tournament</span></div>
    <div id="tpAdm">${admRows||'<p class="subtle">No admins yet.</p>'}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px">
      <select id="tpAdmName" style="flex:1;min-width:120px">${players.map(n=>`<option>${esc(n)}</option>`).join('')}</select>
      <input id="tpAdmPass" type="text" placeholder="password" style="flex:1;min-width:100px;${ps}">
      <button class="btn sm primary" id="tpAdmAdd" style="flex:none">Add admin</button>
    </div>
    <div style="font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--text2);margin:14px 0 4px">UMPIRES <span class="subtle" style="font-weight:600;letter-spacing:0">· record scores only</span></div>
    <div id="tpUmp">${umps.length?umps.map(n=>row(n,'','tpUmpRm')).join(''):'<p class="subtle">No umpires yet.</p>'}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px">
      <select id="tpUmpName" style="flex:1;min-width:120px">${players.map(n=>`<option>${esc(n)}</option>`).join('')}</select>
      <input id="tpUmpPass" type="text" placeholder="password" style="flex:1;min-width:100px;${ps}">
      <button class="btn sm primary" id="tpUmpAdd" style="flex:none">Add umpire</button>
    </div>`;
  const call=async(fn,args,okMsg,action,detail)=>{ try{ const {data}=await sb.rpc(fn,args); if(data&&data.ok){ if(action) store._audit(action,detail); renderTournamentPeople(tid,box); toast(okMsg); } else toast((data&&data.err)||'Could not save'); }catch(e){ toast('Could not save'); } };
  box.querySelectorAll('.tpAdmRm').forEach(b=>b.onclick=()=> call('app_set_admin',{su,sp,target:b.dataset.u,pass:'',tid,on_flag:false},'Admin removed','admin.unset',{username:b.dataset.u,tournament:tid}));
  box.querySelectorAll('.tpUmpRm').forEach(b=>b.onclick=()=> call('app_set_umpire',{su,sp,target:b.dataset.u,pass:'',tid,on_flag:false},'Umpire removed','umpire.remove',{username:b.dataset.u,tournament:tid}));
  box.querySelectorAll('.tpCapEnable').forEach(b=>b.onclick=()=>{ const inp=b.previousElementSibling, pass=(inp&&inp.value||'').trim(); if(!pass){ toast('Set a password'); return; }

let matchSearch='';
function renderMatches(el){
  const t=curTournament();

  if(!t){ el.innerHTML=emptyState('No tournament selected','Create one on the Tournaments tab to start tracking matches.',I.trophy); return; }

// swap a match's sequence (match_no) with its neighbour in the same stage's display order
async function moveMatch(id, dir){
  if(!requireAdmin()) return;
  const m=state.matches.find(x=>x.id===id); if(!m) return;
  const st=m.stage||'League';
  const sm=state.matches.filter(x=>x.tournament_id===m.tournament_id && (x.stage||'League')===st)
    .slice().sort((a,b)=>((a.status==='completed')?1:0)-((b.status==='completed')?1:0)||(a.match_no||0)-(b.match_no||0)||(a.created_at||'').localeCompare(b.created_at||''));
  const i=sm.findIndex(x=>x.id===id); const j=i+dir;
  if(i<0||j<0||j>=sm.length) return;
  const other=sm[j];
  try{ await store.updateMatch(m.id,{match_no:other.match_no}); await store.updateMatch(other.id,{match_no:m.match_no}); await loadAll(); render();
    setTimeout(()=>{ const n=document.getElementById('m-'+id); if(n){ n.scrollIntoView({behavior:'smooth',block:'center'}); n.classList.add('flash'); setTimeout(()=>n.classList.remove('flash'),1000); } },60);
  }catch(e){ toast('Could not reorder'); }
}

let playerSearch='';
let playerSort={ col:'rank', dir:1 };
function renderPlayers(el){
  const ms=scopedMatches();
  const ranked=computeStats(ms);
  const sMap=Object.fromEntries(ranked.map(p=>[p.name,p]));
  const top3=ranked.filter(p=>p.played>0).slice(0,3).map((p,i)=>({...p,place:i+1}));
  // Full roster: everyone in the (scoped) matches + anyone added directly.
  let roster=rosterNames(ms).map(n=>sMap[n]||zeroStats(n));
  const total=roster.length;
  // search by player name or team
  const q=playerSearch.trim().toLowerCase();
  if(q) roster=roster.filter(p=> p.name.toLowerCase().includes(q) || (teamOf(p.name)||'').toLowerCase().includes(q) );
  // sort
  const {col,dir}=playerSort;
  const rankCmp=(a,b)=> b.won-a.won || b.pct-a.pct || b.played-a.played || b.diff-a.diff || a.name.localeCompare(b.name);
  if(col==='rank') roster.sort(rankCmp);
  else if(col==='name') roster.sort((a,b)=>dir*a.name.localeCompare(b.name));
  else if(col==='team') roster.sort((a,b)=>dir*((teamOf(a.name)||'~~').localeCompare(teamOf(b.name)||'~~'))||a.name.localeCompare(b.name));
  else roster.sort((a,b)=>dir*((a[col]-b[col])||0)||a.name.localeCompare(b.name));
  const arrow=c=> playerSort.col===c ? (playerSort.dir<0?' ▾':' ▴') : '';
  const sh=(c,label,extra)=>`<th class="sortable ${extra||''}" data-sort="${c}">${label}${arrow(c)}</th>`;
  const capsAll = state.scope==='all' ? computeCaptainsOverall() : [];

  el.innerHTML = `
    <div class="sectionhead"><h2>Players</h2><div class="spacer"></div>
      <div class="scope-seg" id="scopeSeg">
        <button data-scope="tournament" class="${state.scope==='tournament'?'on':''}">This tournament</button>
        <button data-scope="all" class="${state.scope==='all'?'on':''}">All tournaments</button>
      </div>
    </div>

// Parse a pasted list OR a CSV (incl. the Export format) into clean names.
function parseNames(text){
  const out=[], seen=new Set();
  (text||'').split(/\r?\n/).forEach(line=>{
    let name=line.trim(); if(!name) return;
    if(name.includes(',')){
      const parts=name.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
      name = /^\d+$/.test(parts[0]) ? (parts[1]||'') : parts[0];   // drop a leading rank column
    } else { name=name.replace(/^"|"$/g,''); }
    name=name.trim();
    if(!name || /^(player|name|rank)$/i.test(name)) return;        // skip header cells
    const key=name.toLowerCase();
    if(seen.has(key)) return; seen.add(key);
    out.push(name);
  });
  return out;
}
function pickTextFile(){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept='.csv,.txt,text/csv,text/plain'; i.style.position='fixed'; i.style.left='-9999px'; document.body.appendChild(i); i.onchange=()=>{ const f=(i.files&&i.files[0])||null; i.remove(); res(f); }; i.click(); }); }

function openImportModal(){
  if(!requireAdmin()) return;
  openModal(`
    <div class="modal-head"><h3>Import players</h3><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <div class="err" id="imErr"></div>
      <div class="field"><label>Paste names — one per line</label>
        <textarea id="imText" placeholder="Rahul&#10;Priya&#10;Amit"></textarea>
      </div>
      <button class="btn sm" id="imFile" type="button">${I.upload}Load a .csv or .txt file</button>
      <div class="hint" style="margin-top:8px">Also accepts a CSV like the one <b>Export</b> makes — the “Player” column is used. Blank lines, headers and duplicates are skipped.</div>
      <div class="modal-foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn primary" id="imSave">${I.upload}Import</button>
      </div>
    </div>`);
  modalEl.querySelector('#imFile').onclick=async()=>{
    const f=await pickTextFile(); if(!f) return;
    try{ const txt=await f.text(); const ta=modalEl.querySelector('#imText'); ta.value=(ta.value?ta.value.replace(/\s*$/,'')+'\n':'')+txt; }
    catch(e){ const err=modalEl.querySelector('#imErr'); err.textContent='Could not read that file.'; err.classList.add('show'); }
  };
  modalEl.querySelector('#imSave').onclick=async()=>{
    const err=modalEl.querySelector('#imErr');
    const names=parseNames(modalEl.querySelector('#imText').value);
    if(!names.length){ err.textContent='Paste some names (one per line) or load a file first.'; err.classList.add('show'); return; }
    const existing=new Set(rosterNames(state.matches).map(n=>n.toLowerCase()));
    const fresh=names.filter(n=>!existing.has(n.toLowerCase()));
    if(!fresh.length){ err.textContent='All of those players are already in the roster.'; err.classList.add('show'); return; }
    const btn=modalEl.querySelector('#imSave'); btn.disabled=true; btn.textContent='Importing…';
    try{ await store.addPlayers(fresh); closeModal(); await loadAll(); render(); toast(`Imported ${fresh.length} player${fresh.length!==1?'s':''}${names.length-fresh.length?` · ${names.length-fresh.length} already in roster`:''}`); }
    catch(e){ err.textContent='Could not import: '+(e.message||e); err.classList.add('show'); btn.disabled=false; btn.textContent='Import'; }
  };
}

const teamSlug = s => 'team-'+String(s).replace(/[^a-z0-9]+/gi,'-').toLowerCase();
let teamSort = { col:'rank', dir:1 };

const saveTeamExpanded = ()=>{ try{ localStorage.setItem('bad_team_open', JSON.stringify([...teamExpanded])); }catch(e){} };

function gotoMatch(id){ const m=state.matches.find(x=>x.id===id); if(!m) return; state.tournamentId=m.tournament_id; state.tab='matches'; matchCollapsed.delete('st:'+(m.stage||'League')); saveMatchCollapsed(); render(); setTimeout(()=>{ const n=document.getElementById('m-'+id); if(n){ n.scrollIntoView({behavior:'smooth',block:'center'}); n.classList.add('flash'); setTimeout(()=>n.classList.remove('flash'),1600); } },60); }

function renderTeams(el){
  const ms=tournamentMatches();
  const tstats=computeTeamStats(ms);
  const pMap=Object.fromEntries(computeStats(ms).map(p=>[p.name,p]));
  const tsFor=n=>tstats.find(x=>x.name===n)||{name:n,played:0,won:0,lost:0,pf:0,pa:0,diff:0,pct:0};
  // sortable standings
  let rows=curTeams().map(t=>({t,ts:tsFor(t.name),rank:tstats.findIndex(x=>x.name===t.name)}));
  const {col,dir}=teamSort;
  if(col==='rank') rows.sort((a,b)=>(a.rank<0?99:a.rank)-(b.rank<0?99:b.rank));
  else if(col==='team') rows.sort((a,b)=>dir*a.t.name.localeCompare(b.t.name));
  else rows.sort((a,b)=>dir*((a.ts[col]-b.ts[col])||0) || a.t.name.localeCompare(b.t.name));
  const arrow=c=> teamSort.col===c ? (teamSort.dir<0?' ▾':' ▴') : '';
  const sh=(c,label,extra)=>`<th class="sortable ${extra||''}" data-sort="${c}">${label}${arrow(c)}</th>`;
  el.innerHTML = `
    <div class="sectionhead"><h2>Teams</h2><div class="spacer"></div>
      <button class="btn sm" id="manageTeamsBtn">${I.shield}Manage teams</button>
    </div>
    ${curTeams().length? `
    <div class="card pad" style="margin-bottom:18px">
      <div class="card-title">${I.trophy}Standings</div>
      <div class="tablewrap" style="box-shadow:none;border:none">
        <table><thead><tr>${sh('rank','#')}${sh('team','Team')}${sh('played','P','n')}${sh('won','W','n')}${sh('lost','L','n')}${sh('pct','Win %')}${sh('diff','Pts Diff','n')}</tr></thead>
        <tbody>${rows.map(({t,ts},i)=>`
          <tr><td><div class="rankcell"><span class="rankno ${col==='rank'&&i===0&&ts.played?'top':''}">${(col==='rank'&&i===0&&ts.played)?goldTrophy(16):((col==='rank')?(ts.played?i+1:'·'):i+1)}</span>${teamChip(t.name)}</div></td>
            <td class="n num">${ts.played}</td><td class="n num" style="color:${ts.won?'var(--win)':'var(--muted)'};font-weight:800">${ts.won}</td>
            <td class="n num" style="color:${ts.lost?'var(--danger)':'var(--muted)'}">${ts.lost}</td>
            <td>${ts.played?`<span class="num" style="font-weight:800">${Math.round(ts.pct*100)}%</span>`:'<span class="subtle">—</span>'}</td>
            <td class="n">${ts.played?`<span class="pill diff ${ts.diff>0?'pos':ts.diff<0?'neg':''}">${ts.diff>0?'+':''}${ts.diff}</span>`:''}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>
    ${rows.map(({t,ts})=>{
      const cap=captainOf(t.name);
      const players=Object.keys(state.players).filter(n=>teamOf(n)===t.name).sort((a,b)=>{ if(a===cap)return -1; if(b===cap)return 1; return (((pMap[b]||{won:0}).won)-((pMap[a]||{won:0}).won))||a.localeCompare(b); });
      const tm=ms.filter(m=>sideTeam(m,1)===t.name||sideTeam(m,2)===t.name).sort((a,b)=>(a.match_no||0)-(b.match_no||0));
      const open=teamExpanded.has(t.name);
      return `<div class="card teamcard ${open?'open':''}" id="${teamSlug(t.name)}">
        <button class="teamcard-head" data-toggle="${esc(t.name)}" style="border-left:4px solid ${t.color}">
          <span class="chev">${I.chevron}</span>
          ${teamBadge(t.name,50)}
          <h3>${esc(t.name)}</h3>
          <span class="subtle thd-meta">${players.length} player${players.length!==1?'s':''} · <b style="color:var(--text)">${ts.won}W–${ts.lost}L</b>${cap?` · <span class="captag">★ ${esc(cap)}</span>`:''}</span>
        </button>
        <div class="teamcard-body" ${open?'':'hidden'}>
          <div class="card-title">Players <span class="subtle" style="font-weight:600;text-transform:none;letter-spacing:0">· tap ★ to set captain</span></div>
          <div class="teamplayers">${players.length?players.map(n=>{const ps=pMap[n]||{won:0,lost:0};const isc=cap===n;return `<button class="pdrow2" data-player="${esc(n)}">${avatar(n,32)}<span class="pname">${esc(n)}${isc?'<span class="captag">Captain</span>':''}</span><span class="subtle num">${ps.won}W–${ps.lost}L</span><span class="capstar ${isc?'on':''}" data-team="${esc(t.name)}" data-cap="${esc(n)}" title="${isc?'Remove as captain':'Make captain'}">★</span></button>`;}).join(''):'<p class="subtle">No players assigned yet.</p>'}</div>
          <div class="card-title" style="margin-top:16px">Matches</div>
          <div class="teammatches">${tm.length?tm.map(m=>{
            const isA=sideTeam(m,1)===t.name; const opp=isA?sideTeam(m,2):sideTeam(m,1);

            const w=winnerOf(m); const won=w&&((w===1&&isA)||(w===2&&!isA)); const done=m.status==='completed';

        </div>
      </div>`;
    }).join('')}`
    : emptyState('No teams yet','Create teams on the Players tab (Teams button), then assign players.',I.shield)}`;
  el.querySelector('#manageTeamsBtn')?.addEventListener('click',openTeamsModal);
  el.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{ const c=th.dataset.sort; if(teamSort.col===c) teamSort.dir*=-1; else teamSort={col:c, dir:(c==='team'?1:-1)}; renderTeams(el); });
  el.querySelectorAll('.teamcard-head').forEach(h=>h.onclick=()=>{ const n=h.dataset.toggle; if(teamExpanded.has(n)) teamExpanded.delete(n); else teamExpanded.add(n); saveTeamExpanded(); renderTeams(el); });
  el.querySelectorAll('.capstar').forEach(s=>s.onclick=(e)=>{ e.stopPropagation(); e.preventDefault(); setCaptainFlow(s.dataset.team, s.dataset.cap); });
  el.querySelectorAll('.pdrow2').forEach(b=>b.onclick=()=>openPlayerDetail(b.dataset.player, ms));
  el.querySelectorAll('.tmrow').forEach(b=>b.onclick=()=>gotoMatch(b.dataset.goto));
}

  const nextNo = existing? existing.match_no : (Math.max(0,...tournamentMatches().map(m=>m.match_no||0))+1);
  const tl = curTeams().map(t=>t.name);
  if(!tl.length){
    openModal(`<div class="modal-head"><h3>Add match</h3><button class="x" data-close>✕</button></div>
      <div class="modal-body"><p class="subtle" style="font-size:14px">Set up teams and players first: on the <b style="color:var(--text)">Players</b> tab, add players and assign each to a team (or use <b style="color:var(--text)">Teams</b>). Then you can create matches between them.</p>
      <div class="modal-foot"><button class="btn primary" data-close>OK</button></div></div>`);
    return;
  }
  const t1=existing?(existing.team1||sideTeam(existing,1)||tl[0]):tl[0];
  const t2=existing?(existing.team2||sideTeam(existing,2)||(tl[1]||tl[0])):(tl[1]||tl[0]);
  const curTour=curTournament();
  const sNames=tStageNames(curTour);
  const defStage=existing?existing.stage:(sNames[0]||'League');
  const teamSel=(idv,sel)=>`<select id="${idv}" class="teamsel">${tl.map(t=>`<option ${t===sel?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  openModal(`
    <div class="modal-head"><h3>${existing?'Edit match':'Add match'}</h3><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <div class="err" id="mErr"></div>
      <div class="field"><label>Stage</label><select id="fStage">${sNames.map(s=>`<option ${s===defStage?'selected':''}>${esc(s)}</option>`).join('')}</select>
        <div class="hint" id="fmtHint" style="margin-top:6px"></div>
      </div>
      <div class="vsrow">
        <div class="teamfield a">${teamSel('tA',t1)}<select id="a1" class="psel"></select><select id="a2" class="psel"></select></div>
        <div class="vsbadge">vs</div>
        <div class="teamfield b">${teamSel('tB',t2)}<select id="b1" class="psel"></select><select id="b2" class="psel"></select></div>
      </div>
      <div class="hint">Players come from each team's roster. To add someone, create them on the Players tab first.</div>
      <div class="modal-foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn primary" id="saveMatch">${existing?'Save':'Add match'}</button>
      </div>
    </div>`);
  const fill=(selId, tmSelId, selectedName, optional)=>{
    const tm=modalEl.querySelector(tmSelId).value; const sel=modalEl.querySelector(selId);
    const players=Object.keys(state.players).filter(n=>teamOf(n)===tm).sort((a,b)=>a.localeCompare(b));
    if(selectedName && !players.includes(selectedName)) players.unshift(selectedName);
    const head = optional ? '<option value="">— (optional) —</option>' : (players.length?'':'<option value="">— no players in team —</option>');
    sel.innerHTML = head + players.map(n=>`<option ${n===selectedName?'selected':''}>${esc(n)}</option>`).join('');
  };
  fill('#a1','#tA',existing?existing.team1_p1:'',false); fill('#a2','#tA',existing?existing.team1_p2:'',true);
  fill('#b1','#tB',existing?existing.team2_p1:'',false); fill('#b2','#tB',existing?existing.team2_p2:'',true);
  const showFmt=()=>{ const f=stageFormat(curTour, modalEl.querySelector('#fStage').value); modalEl.querySelector('#fmtHint').textContent=`Format: best of ${f.best_of} · ${f.points} points/game (set per stage in the tournament editor).`; };
  modalEl.querySelector('#tA').onchange=()=>{ fill('#a1','#tA','',false); fill('#a2','#tA','',true); };
  modalEl.querySelector('#tB').onchange=()=>{ fill('#b1','#tB','',false); fill('#b2','#tB','',true); };
  modalEl.querySelector('#fStage').onchange=showFmt; showFmt();

    const err=modalEl.querySelector('#mErr');
    if(!a1||!b1){ err.textContent='Pick Player 1 for each team. If a list is empty, add players to that team on the Players tab first.'; err.classList.add('show'); return; }

      else await store.addMatch({ ...patch, match_no:nextNo, tournament_id:state.tournamentId, status:'scheduled', ...stampBy() });
      closeModal(); await loadAll(); render(); toast(existing?'Match updated':'Match added');
    }catch(e){ err.textContent='Could not save: '+(e.message||e); err.classList.add('show'); }
  };
}

function openScoreModal(id, prefillGames){
  const m=state.matches.find(x=>x.id===id); if(!m) return;
  if(!requireScorer(m.tournament_id)) return;
  const bo=bestOf(m), pts=m.points||21, need=needGames(m);
  // games kept in memory; nothing is written to the DB until the whole match is confirmed & saved
  const prev=prefillGames||gamesOf(m);
  const games=prev.map(g=>({s1:g.s1, s2:g.s2}));
  const tallyOf=(n)=>{ let a=0,b=0; for(let i=0;i<n && i<games.length;i++){ const w=gameWin(games[i],pts); if(w===1)a++; else if(w===2)b++; } return {a,b}; };

  // Final overall confirm (result summary) → commit the whole match + auto-advance to the next pending match
  const showConfirm=(gs)=>{
    let a=0,b=0; gs.forEach(g=>{ const w=gameWin(g,pts); if(w===1)a++; else b++; });
    const t1=team(m.team1_p1,m.team1_p2), t2=team(m.team2_p1,m.team2_p2);
    const winPair = a>b ? t1 : t2;
    const scoreLine = gs.map(g=>`${g.s1}–${g.s2}`).join(', ');
    const commit=async()=>{ try{
        await store.updateMatch(id,{games:gs, score1:null, score2:null, status:'completed', ...stampBy()});
        closeModal(); await loadAll(); render();
        const nextId=nextPendingMatchAfter(id);
        if(nextId){ toast('Result saved'); openScoreModal(nextId); }   // one at a time: open the next match needing a score
        else toast('All matches recorded 🎉');
      }catch(e){ const ce=modalEl.querySelector('#cErr'); if(ce){ ce.textContent='Could not save: '+(e.message||e); ce.classList.add('show'); } } };
    openModal(`
      <div class="modal-head"><h3>Confirm result · Match ${pairNoFor(m)}</h3><button class="x" data-close>✕</button></div>
      <div class="modal-body">
        <div class="err" id="cErr"></div>
        <p class="subtle" style="text-align:center;margin:-2px 0 14px">Check this is right before saving.</p>
        <div class="confirmbox">
          <div class="cpair"><span class="glbl a">${esc(t1)}</span><span class="cvs">vs</span><span class="glbl b">${esc(t2)}</span></div>
          <div class="cscore">${esc(scoreLine)}</div>
          <div class="cres">Games won: <strong>${a} – ${b}</strong></div>
          <div class="cwin">🏆 ${esc(winPair)} wins</div>
        </div>
        <div class="modal-foot">
          <button class="btn" id="backScore">Back</button>
          <button class="btn primary" id="confirmSave">${I.check}Confirm &amp; save</button>
        </div>
      </div>`, 'score-modal');
    modalEl.querySelector('#backScore').onclick=()=>step(gs.length-1);   // back to the deciding game, scores kept
    modalEl.querySelector('#confirmSave').onclick=async()=>{
      if(!actor()){ openUserModal(commit); return; }   // ask name once, then save with attribution
      await commit();
    };
  };

  // Record ONE game at a time; advance on confirm until a team takes the match (games held in memory only)
  const step=(gi)=>{
    const cur=games[gi]||{s1:'',s2:''};
    openModal(`
      <div class="modal-head"><h3>Record score · Match ${pairNoFor(m)} · Game ${gi+1}</h3><button class="x" data-close>✕</button></div>
      <div class="modal-body">
        <div class="err" id="sErr"></div>
        <p class="subtle" style="text-align:center;margin:-2px 0 12px">Best of ${bo} — first to ${need} games · ${pts} points/game (deuce at ${pts-1}–${pts-1}: win by 2)</p>
        <div class="gamegrid">
          <span></span>
          <div class="glbl a">${esc(team(m.team1_p1,m.team1_p2))}</div>
          <div class="glbl b">${esc(team(m.team2_p1,m.team2_p2))}</div>
          <span class="gnum">Game ${gi+1}</span>
          <input class="gin g1" type="number" inputmode="numeric" min="0" max="99" value="${cur.s1??''}" placeholder="0">
          <input class="gin g2" type="number" inputmode="numeric" min="0" max="99" value="${cur.s2??''}" placeholder="0">
        </div>
        <div id="tally" class="tallyline"></div>
        <div class="modal-foot">
          ${ gi>0 ? `<button class="btn" id="backScore">Back</button>`
                  : (m.status==='completed' ? `<button class="btn danger" id="clearScore">Clear</button>` : `<button class="btn" data-close>Cancel</button>`) }
          <button class="btn primary" id="saveScore">${I.check}<span id="saveLbl">Confirm &amp; next game</span></button>
        </div>
      </div>`, 'score-modal');
    const g1=modalEl.querySelector('.g1'), g2=modalEl.querySelector('.g2');
    const refresh=()=>{
      const base=tallyOf(gi); let a=base.a, b=base.b;
      const w=(g1.value!==''&&g2.value!=='')?gameWin({s1:parseInt(g1.value,10),s2:parseInt(g2.value,10)},pts):0;
      if(w===1)a++; else if(w===2)b++;
      const decided=w&&Math.max(a,b)>=need, last=(gi===bo-1);
      const tEl=modalEl.querySelector('#tally');
      tEl.textContent='Games won:  '+a+' – '+b;
      tEl.style.color=(Math.max(a,b)>=need)?'var(--win)':'var(--text2)';
      modalEl.querySelector('#saveLbl').innerHTML=(decided||last)?'Confirm &amp; save result':'Confirm &amp; next game';
    };
    g1.addEventListener('input',refresh); g2.addEventListener('input',refresh); refresh();
    if(modalEl.querySelector('#backScore')) modalEl.querySelector('#backScore').onclick=()=>step(gi-1);   // previous game, score kept
    modalEl.querySelector('#saveScore').onclick=()=>{
      const err=modalEl.querySelector('#sErr'); const s1=parseInt(g1.value,10), s2=parseInt(g2.value,10);
      if(g1.value===''||g2.value===''||isNaN(s1)||isNaN(s2)){ err.textContent='Fill both scores for this game.'; err.classList.add('show'); return; }
      if(s1===s2){ err.textContent=`Game ${gi+1} can't be tied — each game needs a winner.`; err.classList.add('show'); return; }
      const hi=Math.max(s1,s2), lo=Math.min(s1,s2);
      if(hi < pts){ err.textContent=`Game ${gi+1} isn't finished — a game is played to ${pts} points (the winner must reach ${pts}).`; err.classList.add('show'); return; }
      if(hi-lo < 2){ err.textContent=`Game ${gi+1} isn't finished — at ${pts-1}–${pts-1} it's deuce; you must win by 2 (e.g. ${pts+1}–${pts-1}).`; err.classList.add('show'); return; }
      games[gi]={s1,s2};
      const {a,b}=tallyOf(gi+1);
      if(Math.max(a,b)>=need){ games.length=gi+1; showConfirm(games.slice()); }   // match decided — stop asking, go to the final confirm
      else step(gi+1);                                                             // otherwise, next game
    };
    modalEl.querySelector('#clearScore')?.addEventListener('click',async()=>{
      const commit=async()=>{ try{ await store.updateMatch(id,{games:[], score1:null, score2:null, status:'scheduled', ...stampBy()}); closeModal(); await loadAll(); render(); toast('Score cleared'); }catch(e){} };
      if(!actor()){ openUserModal(commit); return; }
      await commit();
    });
  };
  step(0);
}

    const stage_config={}; const renames=[]; const seen=new Set();
    for(let i=0;i<rows.length;i++){ const r=rows[i]; const nm=r.querySelector('.sfname').value.trim();
      if(!nm){ err.textContent='Every stage needs a name.'; err.classList.add('show'); return; }
      if(seen.has(nm.toLowerCase())){ err.textContent=`Two stages are named "${nm}".`; err.classList.add('show'); return; }
      seen.add(nm.toLowerCase());
      stage_config[nm]={ best_of:parseInt(r.querySelector('.sfbo').value,10), points:parseInt(r.querySelector('.sfpts').value,10), order:i };
      const orig=r.dataset.orig; if(orig && orig!==nm) renames.push({orig, nm});
    }
    const patch={ name, edition:modalEl.querySelector('#tEd').value.trim()||null, start_date:modalEl.querySelector('#tDate').value||null, status:modalEl.querySelector('#tStatus').value, stage_config };
    const btn=modalEl.querySelector('#saveT'); btn.disabled=true; btn.textContent='Saving…';
    try{
      let tid=id;

      else { const nt=await store.addTournament(patch); tid=nt.id;
        const copyEl=modalEl.querySelector('#tCopy'); const copyFrom=copyEl?copyEl.value:'';
        if(copyFrom) await store.copyTeamsAndRosters(copyFrom, tid); }
      const imgPatch={};
      if(typeof pendSchedule==='string' && pendSchedule.startsWith('data:')) imgPatch.schedule_url=await store.saveImage(pendSchedule,`tournament/${tid}/schedule.jpg`);
      else if(pendSchedule==='') imgPatch.schedule_url=null;
      if(Object.keys(imgPatch).length) await store.updateTournament(tid,imgPatch);
      for(const rn of renames) await store.renameStage(tid, rn.orig, rn.nm);
      for(const s in stage_config){ const f=stage_config[s]; await store.applyStageFormat(tid, s, f.best_of, f.points); }
      if(!t) state.tournamentId=tid;
      closeModal(); await loadAll(); if(!t) state.tab='matches'; render(); toast(t?'Tournament updated':'Tournament created');
    }catch(e){ err.textContent='Could not save: '+(e.message||e); err.classList.add('show'); btn.disabled=false; btn.textContent=t?'Save':'Create'; }
  };
}

function confirmDelete(kind,id){
  if(kind==='tournament'){ if(!requireSuper()){ toast('Only a super-admin can delete tournaments'); return; } }
  else if(!requireAdmin()) return;
  const label = kind==='tournament' ? (state.tournaments.find(t=>t.id===id)?.name||'this tournament') : 'this match';
  const extra = kind==='tournament' ? ' This also deletes all its matches.' : '';
  openModal(`
    <div class="modal-head"><h3>Delete ${kind}?</h3><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <p class="subtle" style="font-size:14px;margin-bottom:4px">Delete <b style="color:var(--text)">${esc(label)}</b>?${extra} This can't be undone.</p>
      <div class="modal-foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn primary" style="background:var(--danger)" id="confirmDel">${I.trash}Delete</button>
      </div>
    </div>`);
  modalEl.querySelector('#confirmDel').onclick=async()=>{
    try{
      if(kind==='tournament'){ await store.deleteTournament(id); if(state.tournamentId===id) state.tournamentId=null; }
      else await store.deleteMatch(id);
      closeModal(); await loadAll(); render(); toast('Deleted');
    }catch(e){ toast('Could not delete'); }
  };
}

function openPlayerDetail(name, ms){
  const stats=computeStats(ms).find(p=>p.name===name) || { name, played:0, won:0, lost:0, pf:0, pa:0, diff:0, pct:0, partners:{}, matches:[] };
  const partners=Object.entries(stats.partners).map(([n,v])=>({n,...v,pct:v.g?v.w/v.g:0})).sort((a,b)=>b.w-a.w||b.pct-a.pct);
  const hist=stats.matches.slice().sort((a,b)=>(b.m.match_no||0)-(a.m.match_no||0));
  const hasPic=!!(state.players[name]&&state.players[name].avatar_url);
  openModal(`
    <div class="modal-head"><h3>${esc(name)}</h3><button class="iconbtn" id="pdRename" title="Rename player" style="width:32px;height:32px;margin-left:8px">${I.edit}</button><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
        ${avatar(name,58)}
        <div class="ubtns">
          <button class="btn sm" id="pdPhoto">${I.plus}${hasPic?'Change photo':'Upload photo'}</button>
          ${hasPic?`<button class="btn sm ghost danger" id="pdPhotoRm">Remove</button>`:''}
        </div>
      </div>
      <div class="field" style="margin-bottom:16px"><label>Team</label><select id="pdTeam">${teamOptions(teamOf(name)||'')}</select></div>
      <div class="pd-stats">
        <div class="pd-stat"><div class="v num">${stats.played}</div><div class="k">Played</div></div>
        <div class="pd-stat"><div class="v num" style="color:var(--win)">${stats.won}</div><div class="k">Won</div></div>
        <div class="pd-stat"><div class="v num" style="color:var(--danger)">${stats.lost}</div><div class="k">Lost</div></div>
        <div class="pd-stat"><div class="v num">${Math.round(stats.pct*100)}%</div><div class="k">Win rate</div></div>
      </div>
      ${partners.length?`<div class="card-title" style="margin-bottom:9px">Partners</div>
      <ul class="pd-list" style="margin-bottom:16px">${partners.map(p=>`<li><span style="font-weight:700">${esc(p.n)}</span><span class="mscore">${p.w}W–${p.g-p.w}L · ${Math.round(p.pct*100)}%</span></li>`).join('')}</ul>`:''}
      <div class="card-title" style="margin-bottom:9px">Match history</div>
      <ul class="pd-list">${hist.map(h=>{ const side=[h.m.team1_p1,h.m.team1_p2].includes(name)?1:2; const gw=gamesWon(h.m); const mg=side===1?gw.a:gw.b, og=side===1?gw.b:gw.a; const opp=oppOf(h.m,name); return `<li>
        <span class="res ${h.won?'w':'l'}" ${h.won?'style="display:inline-flex;align-items:center;gap:3px"':''}>${h.won?goldTrophy(11)+'W':'L'}</span>
        <span style="min-width:0">#${pairNoFor(h.m)} ${h.partner?'with '+esc(h.partner):''} <span style="color:var(--muted)">vs ${esc(team(opp[0],opp[1]))}</span></span>
        <span class="mscore">${mg}–${og}</span>
      </li>`;}).join('')}</ul>
      ${hist.length?'':'<p class="subtle" style="margin-top:4px">No matches yet.</p>'}
      <div class="modal-foot" style="margin-top:18px"><button class="btn danger" id="pdRemove" style="flex:none">${I.trash}Remove player</button></div>
    </div>`);
  modalEl.querySelector('#pdRemove').onclick=()=>removePlayerFlow(name);
  modalEl.querySelector('#pdRename').onclick=()=>openRenamePlayer(name);
  modalEl.querySelector('#pdTeam').onchange=async(e)=>{
    const oldTeam=teamOf(name)||'', newTeam=e.target.value||'';
    if(oldTeam && oldTeam!==newTeam){
      const msg = newTeam ? `Move ${name} from "${oldTeam}" to "${newTeam}"?` : `Remove ${name} from "${oldTeam}"?`;
      if(!confirm(msg)){ e.target.value=oldTeam; return; }
    }
    try{ await store.setPlayerTeam(name, newTeam||null); await loadAll(); render(); toast('Team updated'); }catch(err){ toast('Could not update team'); e.target.value=oldTeam; }
  };
  modalEl.querySelector('#pdPhoto').onclick=async()=>{
    const f=await pickImage(); if(!f) return;
    const btn=modalEl.querySelector('#pdPhoto'); btn.textContent='Uploading…'; btn.disabled=true;
    try{
      const data=await resizeImage(f,320,0.82,true);
      const url=await store.saveImage(data,`player/${encodeURIComponent(name)}.jpg`);
      await store.setPlayerAvatar(name,url);
      await loadAll(); render(); openPlayerDetail(name, scopedMatches()); toast('Photo saved');
    }catch(e){ toast(e.message||'Upload failed'); btn.textContent='Upload photo'; btn.disabled=false; }
  };
  modalEl.querySelector('#pdPhotoRm')?.addEventListener('click',async()=>{
    try{ await store.setPlayerAvatar(name,null); await loadAll(); render(); openPlayerDetail(name, scopedMatches()); toast('Photo removed'); }catch(e){ toast('Could not remove'); }
  });
}
function oppOf(m,name){
  const inA=[m.team1_p1,m.team1_p2].includes(name);
  return inA? [m.team2_p1,m.team2_p2] : [m.team1_p1,m.team1_p2];
}
function openRenamePlayer(oldName){
  if(!requireAdmin()) return;
  openModal(`<div class="modal-head"><h3>Rename player</h3><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <div class="err" id="rnErr"></div>
      <p class="subtle" style="font-size:13px;margin-bottom:12px">Updates this player everywhere — matches, team rosters, captain and history, across all tournaments.</p>
      <div class="field"><label>Name</label><input id="rnName" value="${esc(oldName)}" maxlength="40" autocomplete="off"></div>
      <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="rnSave">Save</button></div>
    </div>`);
  const inp=modalEl.querySelector('#rnName'), err=modalEl.querySelector('#rnErr');
  setTimeout(()=>{ inp.focus(); inp.select(); },60);
  const save=async()=>{
    const nn=inp.value.trim();
    if(!nn){ err.textContent='Enter a name.'; err.classList.add('show'); return; }
    if(nn===oldName){ closeModal(); return; }
    if(Object.keys(state.players).some(n=>n.toLowerCase()===nn.toLowerCase() && n!==oldName)){ err.textContent='A player with that name already exists.'; err.classList.add('show'); return; }
    const btn=modalEl.querySelector('#rnSave'); btn.disabled=true; btn.textContent='Saving…';
    try{
      await store.renamePlayer(oldName,nn);
      if(getUser()===oldName){ setUser(nn); renderUserPill(); }
      await loadAll(); render(); openPlayerDetail(nn, scopedMatches()); toast('Player renamed');
    }catch(e){ err.textContent='Could not rename: '+(e.message||e); err.classList.add('show'); btn.disabled=false; btn.textContent='Save'; }
  };
  modalEl.querySelector('#rnSave').onclick=save;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } });
}

function removePlayerFlow(name){
  if(!requireAdmin()) return;
  const mc=matchCountFor(name);
  if(mc>0){
    openModal(`
      <div class="modal-head"><h3>Can't remove ${esc(name)}</h3><button class="x" data-close>✕</button></div>
      <div class="modal-body">
        <p class="subtle" style="font-size:14px;margin-bottom:12px">${esc(name)} is in <b style="color:var(--text)">${mc} match${mc!==1?'es':''}</b>. To keep the data consistent, delete or re-assign those matches on the <b style="color:var(--text)">Matches</b> tab first — then you can remove this player.</p>
        <div class="modal-foot"><button class="btn primary" data-close>OK</button></div>
      </div>`);
    return;
  }
  openModal(`
    <div class="modal-head"><h3>Remove ${esc(name)}?</h3><button class="x" data-close>✕</button></div>
    <div class="modal-body">
      <p class="subtle" style="font-size:14px;margin-bottom:12px">Remove <b style="color:var(--text)">${esc(name)}</b> from the roster? This also clears their profile photo. They're not in any match.</p>
      <div class="modal-foot">
        <button class="btn" data-close>Cancel</button>
        <button class="btn primary" style="background:var(--danger)" id="rpYes">${I.trash}Remove</button>
      </div>
    </div>`);
  modalEl.querySelector('#rpYes').onclick=async()=>{
    try{ await store.removePlayer(name); closeModal(); await loadAll(); render(); toast('Player removed'); }
    catch(e){ toast(e.message&&e.message.includes('foreign')?'Player is referenced by a match — remove it first.':'Could not remove'); }
  };
}

/* ================================================================
   CSV export
   ================================================================ */
function exportCSV(stats){
  const rows=[['Rank','Player','Played','Won','Lost','WinPct','PointsFor','PointsAgainst','Diff']];
  stats.forEach((p,i)=>rows.push([i+1,p.name,p.played,p.won,p.lost,Math.round(p.pct*100)+'%',p.pf,p.pa,p.diff]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=(curTournament()?.name||'standings').replace(/[^\w]+/g,'_')+'_standings.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('CSV downloaded');
}

/* ================================================================
   TOAST + THEME
   ================================================================ */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }

const themeBtn=document.getElementById('themeBtn');
function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'dark'; }
function applyTheme(mode){ document.documentElement.setAttribute('data-theme',mode); try{localStorage.setItem('bad_theme',mode)}catch(e){} setThemeIcon(); if(state.tab==='settings') render(); }
function setThemeIcon(){ themeBtn.innerHTML = currentTheme()==='dark'? I.sun : I.moon; }
themeBtn.onclick=()=>applyTheme(currentTheme()==='dark'?'light':'dark');
try{ const saved=localStorage.getItem('bad_theme'); document.documentElement.setAttribute('data-theme', saved||'dark'); }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
/* ---- accent color ---- */
const ACCENTS=['#F5C518','#FF5A3C','#22A7E0','#8B5CF6','#5CE6A1'];
const hexToRgb=h=>{ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h); return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:null; };
function getAccent(){ try{ return localStorage.getItem('bad_accent')||'#F5C518'; }catch(e){ return '#F5C518'; } }
function applyAccent(hex){ try{localStorage.setItem('bad_accent',hex)}catch(e){} const d=document.documentElement.style; d.setProperty('--accent',hex);
  const r=hexToRgb(hex); if(r){ const lum=0.299*r.r+0.587*r.g+0.114*r.b; d.setProperty('--accent-ink',lum>150?'#0A0E1A':'#ffffff'); d.setProperty('--accent-bg',`rgba(${r.r},${r.g},${r.b},.13)`); d.setProperty('--accent-bd',`rgba(${r.r},${r.g},${r.b},.32)`); }
  if(state.tab==='settings') render(); }
applyAccent(getAccent());
setThemeIcon();

document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b)return; if(b.dataset.tab==='admin'){ location.hash='#admin'; render(); return; } if(location.hash==='#admin'){ location.hash=''; } state.tab=b.dataset.tab; render(); });
document.getElementById('adminBtn').addEventListener('click',()=>{ location.hash = isAdminRoute()?'':'#admin'; render(); });
window.addEventListener('hashchange',render);
document.getElementById('tournamentSel').addEventListener('change',e=>{ state.tournamentId=e.target.value; render(); });
document.getElementById('userPill').addEventListener('click',()=>openUserModal());
// clicking any team chip opens the Teams page for that team (capture phase so it beats row handlers)
document.addEventListener('click',e=>{ const c=e.target.closest&&e.target.closest('.tchip[data-teamnav]'); if(c){ e.preventDefault(); e.stopPropagation(); gotoTeam(c.getAttribute('data-teamnav')); } }, true);
// clicking any player name opens that player's card
document.addEventListener('click',e=>{ const p=e.target.closest&&e.target.closest('.pclick[data-player]'); if(p){ e.preventDefault(); e.stopPropagation(); openPlayerDetail(p.getAttribute('data-player'), scopedMatches()); } }, true);

(async function start(){
  const pill=document.getElementById('connPill'), ct=document.getElementById('connText');
  if(useDB){ pill.className='conn live'; ct.textContent='Live sync'; } else { pill.className='conn local'; ct.textContent='On this device'; }
  renderUserPill();
  try{
    await initAuth();
    await store.init();
    await loadAll();
    render();
  }catch(e){
    document.querySelector('.wrap').innerHTML = `<div class="banner" style="background:var(--danger-bg);color:var(--danger)"><span>${I.flame}</span><div><b>Couldn't load data.</b> ${esc(e.message||e)}<br>Check your Supabase URL/key and that schema.sql has been run.</div></div>`;
  }
})();
